<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia: 2 contra 2</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif;--ouro:#E4C874;--time:#e0a040;--bot:#a07ad0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#120c08 url('https://api.scryfall.com/cards/named?exact=Selvala%2C%20Heart%20of%20the%20Wilds&format=image&version=art_crop') center/cover fixed;font-family:'EB Garamond',serif;color:#eee;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:#0a0604d0}
#ctrl{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:8px}
#ctrl button{font-family:var(--ff);background:#3a2a18;border:1px solid var(--ouro);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
#ctrl button:hover{filter:brightness(1.2)}

/* ---------- sala de espera ---------- */
#sala{position:relative;z-index:1;max-width:760px;margin:40px auto 0;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .4s}
#sala h2{font-family:var(--ff);color:var(--ouro);margin:0 0 6px;letter-spacing:.08em}
.rot{font-family:var(--ff);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.rot.bots{color:var(--bot)}.rot.time{color:var(--time)}
.fila{display:flex;gap:18px}
.cartao{position:relative;width:300px;height:170px;border-radius:12px;background:#1a120c center 30%/cover;border:2px solid;box-shadow:0 8px 24px #000a}
.cartao.bot{border-color:#a07ad099;box-shadow:0 0 18px #a07ad033,0 8px 24px #000a}
.cartao.jog{border-color:#e0a04099;box-shadow:0 0 18px #e0a04033,0 8px 24px #000a}
.cartao::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(0deg,#000c 0%,transparent 55%)}
.cartao .cmd{position:absolute;left:12px;right:12px;bottom:26px;z-index:1;font-family:var(--ff);font-size:14px;color:#fff;text-shadow:0 2px 6px #000;text-align:center}
.cartao .av{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);z-index:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff);font-weight:800;font-size:18px;color:#fff;border:3px solid}
.cartao.bot .av{background:#3a2a4a;border-color:var(--bot)}
.cartao.jog .av{background:#5a3a14;border-color:var(--time)}
.cartao .quem{position:absolute;left:0;right:0;bottom:-44px;text-align:center;font-size:13px;color:#d9c8b0}
.cartao.vazio{background:repeating-linear-gradient(45deg,#1a120c,#1a120c 10px,#20160e 10px,#20160e 20px);border-style:dashed;border-color:#e0a04066;display:grid;place-items:center;color:#bfa88f;font-size:14px}
.cartao.vazio::after{display:none}
.cartao.vazio span{animation:pisca 1.6s ease-in-out infinite}
@keyframes pisca{50%{opacity:.4}}
.cartao.entrou{animation:entrou .6s ease-out}
@keyframes entrou{from{transform:scale(.9);filter:brightness(2)}to{transform:none}}
.vsLinha{display:flex;align-items:center;gap:14px;width:100%;margin:30px 0 4px}
.vsLinha::before,.vsLinha::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,#c9a24a88,transparent)}
.vsLinha b{font-family:var(--ff);font-weight:800;font-size:30px;color:var(--ouro);text-shadow:0 0 14px #c9a24a88}
.fila.baixo{margin-top:6px;margin-bottom:46px}
.btnComecar{margin-top:8px;font-family:var(--ff);font-size:16px;padding:10px 40px;border-radius:9px;border:1px solid var(--ouro);background:linear-gradient(#e0b050,#a87a28);color:#1a1008;cursor:pointer}
.btnComecar:disabled{opacity:.45;cursor:default}

/* ---------- entrada (ao começar) ---------- */
#vs{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;perspective:1400px}
#vs.on{display:block}
#vs .fundo{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a0e06f2,#050302fa 70%);opacity:0;animation:aparece .5s forwards}
#vs.sai .fundo{animation:some .7s .5s forwards}
@keyframes aparece{to{opacity:1}}@keyframes some{from{opacity:1}to{opacity:0}}
#vs .grade{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center}
#vs .lado{display:flex;gap:4vw}
#vs .lado.cima{align-self:end;margin-bottom:2vh}#vs .lado.baixo{align-self:start;margin-top:2vh}
#vs .c{position:relative;width:min(15vw,190px);aspect-ratio:63/88;border-radius:4.5%/3.3%;background:#000 center/cover;opacity:0}
#vs .cima .c{transform:translateY(-70vh) rotateX(25deg);animation:desceCima 1.1s cubic-bezier(.2,.9,.3,1) forwards}
#vs .baixo .c{transform:translateY(70vh) rotateX(-25deg);animation:sobeBaixo 1.1s cubic-bezier(.2,.9,.3,1) forwards}
#vs .lado .c:nth-child(2){animation-delay:.18s}
@keyframes desceCima{to{opacity:1;transform:translateY(0) rotateX(6deg)}}
@keyframes sobeBaixo{to{opacity:1;transform:translateY(0) rotateX(-6deg)}}
#vs .f{position:absolute;inset:0;border-radius:inherit;background:#000 center/cover;box-shadow:inherit;animation:flutua 3s ease-in-out 1.3s infinite}
#vs .lado .c:nth-child(2) .f{animation-delay:1.7s}
@keyframes flutua{0%,100%{transform:translateY(0) rotateZ(-.6deg)}50%{transform:translateY(-14px) rotateZ(.6deg)}}
#vs .cima .f{box-shadow:0 0 0 2px #d8c0ff88,0 0 30px 6px #a07ad0aa,0 20px 40px #000c}
#vs .baixo .f{box-shadow:0 0 0 2px #ffe8b088,0 0 30px 6px #e0a040aa,0 20px 40px #000c}
#vs .c .av{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff);font-weight:800;color:#fff;border:3px solid}
#vs .cima .av{background:#3a2a4a;border-color:var(--bot)}#vs .baixo .av{background:#5a3a14;border-color:var(--time)}
#vs .c .nm{position:absolute;left:-20%;right:-20%;text-align:center;font-family:var(--ff);font-size:13px;color:#fff;text-shadow:0 2px 8px #000}
#vs .cima .nm{top:-26px}#vs .baixo .nm{bottom:-44px}
#vs .meio{display:flex;align-items:center;gap:20px;width:80vw}
#vs .meio::before,#vs .meio::after{content:'';flex:1;height:3px;background:linear-gradient(90deg,transparent,#ffd070,transparent);transform:scaleX(0);animation:risco .4s 1.5s forwards}
@keyframes risco{to{transform:scaleX(1)}}
#vs .meio b{font-family:var(--ff);font-weight:800;font-size:clamp(40px,6vw,80px);color:#ffe08a;text-shadow:0 0 20px #ff9a3a,0 0 50px #ff6a2a88;opacity:0;transform:scale(3);animation:bate .35s 1.35s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bate{to{opacity:1;transform:scale(1)}}
#vs.treme .grade{animation:treme .35s}
@keyframes treme{20%{transform:translate(6px,-4px)}40%{transform:translate(-5px,3px)}60%{transform:translate(4px,4px)}80%{transform:translate(-3px,-2px)}}
#vs .txt{position:absolute;left:0;right:0;bottom:4vh;text-align:center;color:#bfa88f;font-size:14px;opacity:0;animation:aparece .5s 2s forwards}
/* saída: bots voltam para cima, vocês para baixo */
#vs.sai .cima .c{animation:saiCima .8s cubic-bezier(.6,0,.4,1) forwards}
#vs.sai .baixo .c{animation:saiBaixo .8s cubic-bezier(.6,0,.4,1) forwards}
#vs.sai .meio,#vs.sai .txt{transition:opacity .3s;opacity:0}
@keyframes saiCima{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70vh)}}
@keyframes saiBaixo{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(70vh)}}
.faisca{position:fixed;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ff9a3a;z-index:21;pointer-events:none;animation:faisca .9s ease-out forwards}
@keyframes faisca{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--x),var(--y))}}
</style></head><body>
<div id="ctrl"><button id="bParceiro">Simular: parceiro entrou</button><button id="bPronto">Simular: partida carregou</button><button id="bReset">Recomeçar prévia</button></div>

<div id="sala">
  <h2>2v2 · Sexta do Commander</h2>
  <div class="rot bots">Bots</div>
  <div class="fila cima" id="filaBots"></div>
  <div class="vsLinha"><b>VS</b></div>
  <div class="rot time">Seu time</div>
  <div class="fila baixo" id="filaTime"></div>
  <button class="btnComecar" id="bComecar" disabled>Começar partida</button>
</div>
<div id="vs"></div>

<script>
const art = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=art_crop`;
const img = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=normal`;
const BOTS = [{cmd:'Selvala, Heart of the Wilds', nome:'Bot 1', av:'B1'}, {cmd:"Cloud, Planet's Champion", nome:'Bot 2', av:'B2'}];
const TIME = [{cmd:'Baba Lysaga, Night Witch', nome:'Twelvez (você)', av:'T'}, {cmd:'Krenko, Mob Boss', nome:'Irmão', av:'I'}];
let parceiro = false;
const cartao = (p, cls)=>`<div class="cartao ${cls}" style="background-image:url('${art(p.cmd)}')"><div class="cmd">${p.cmd}</div><div class="av">${p.av}</div><div class="quem">${p.nome}</div></div>`;
function desenharSala(){
  document.getElementById('filaBots').innerHTML = BOTS.map(b=>cartao(b,'bot')).join('');
  document.getElementById('filaTime').innerHTML = cartao(TIME[0],'jog') + (parceiro ? cartao(TIME[1],'jog entrou') : '<div class="cartao vazio"><span>Esperando parceiro...</span></div>');
  document.getElementById('bComecar').disabled = !parceiro;
}
function espadas(){ const a = new Audio('sons/espadas/choque1.ogg'); a.volume = .12; a.play().catch(()=>{}); }
let inicio = 0, saiu = false;
function comecar(){
  const vs = document.getElementById('vs');
  const c = (p)=>`<div class="c"><div class="f" style="background-image:url('${img(p.cmd)}')"><div class="nm">${p.nome}</div><div class="av">${p.av}</div></div></div>`;
  vs.className = ''; void vs.offsetWidth;
  vs.innerHTML = `<div class="fundo"></div><div class="grade"><div class="lado cima">${BOTS.map(c).join('')}</div><div class="meio"><b>VS</b></div><div class="lado baixo">${TIME.map(c).join('')}</div></div><div class="txt">Embaralhando...</div>`;
  vs.classList.add('on'); document.getElementById('sala').style.opacity = .15;
  inicio = Date.now(); saiu = false;
  setTimeout(()=>{ espadas(); vs.classList.add('treme');
    for (let i=0;i<26;i++){ const f = document.createElement('div'); f.className = 'faisca'; const a = Math.random()*Math.PI*2, r = 80+Math.random()*260;
      f.style.setProperty('--x', Math.cos(a)*r+'px'); f.style.setProperty('--y', Math.sin(a)*r*.6+'px'); document.body.appendChild(f); setTimeout(()=>f.remove(), 1000); } }, 1400);
}
function sair(){
  const vs = document.getElementById('vs'); if (!vs.classList.contains('on') || saiu) return; saiu = true;
  setTimeout(()=>{ vs.classList.add('sai'); setTimeout(()=>{ vs.className=''; vs.innerHTML=''; document.getElementById('sala').style.opacity = 0; }, 1300); }, Math.max(0, 5000 - (Date.now()-inicio)));
}
document.getElementById('bParceiro').onclick = ()=>{ parceiro = true; desenharSala(); };
document.getElementById('bComecar').onclick = comecar;
document.getElementById('bPronto').onclick = sair;
document.getElementById('bReset').onclick = ()=>{ parceiro = false; document.getElementById('sala').style.opacity = 1; const vs = document.getElementById('vs'); vs.className=''; vs.innerHTML=''; desenharSala(); };
desenharSala();
</script>
</body></html>
