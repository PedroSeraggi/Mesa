<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Comece sua jornada</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Metamorphous&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif;--fa:'Metamorphous',serif}
/* fundo: a pintura dos magos em volta da Mesa, escurecida e respirando devagar */
#fundo{position:fixed;inset:-4%;background:url('cutscenes/abertura/q1b.jpg') center 40%/cover;filter:blur(3px) saturate(.75) brightness(.42);animation:respiraFundo 40s ease-in-out infinite alternate;z-index:-3}
@keyframes respiraFundo{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
#veu{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 75% 65% at 50% 52%,transparent 30%,#06040acc 75%,#06040a 100%),linear-gradient(180deg,#06040ad0,transparent 26%,transparent 70%,#06040af0)}
.nevoa{position:fixed;left:-20%;right:-20%;height:45vh;z-index:-2;pointer-events:none;opacity:.35;background:radial-gradient(ellipse 30% 50% at 30% 50%,#c9b48a33,transparent 70%),radial-gradient(ellipse 25% 40% at 70% 60%,#c9b48a26,transparent 70%);filter:blur(20px);animation:nevoa 38s linear infinite alternate}
.nevoa.n1{bottom:-8vh}.nevoa.n2{bottom:10vh;opacity:.2;animation-duration:55s;animation-direction:alternate-reverse}
@keyframes nevoa{to{transform:translateX(12%)}}
/* círculo de runas gigante girando atrás dos estandartes */
#runas{position:fixed;left:50%;top:56%;width:min(110vh,1100px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;opacity:.22;animation:giraRunas 160s linear infinite}
#runas text{fill:#e8c870}#runas circle,#runas line{stroke:#e8c870;fill:none}
@keyframes giraRunas{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* ornamento embaixo do título */
.orn{display:flex;align-items:center;gap:14px;margin-top:-14px;animation:titulo 1.2s .2s ease-out both}
.orn i{display:block;width:min(22vw,260px);height:1px;background:linear-gradient(90deg,transparent,#e8b84a)}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:10px;height:10px;transform:rotate(45deg);border:1px solid #e8b84a;box-shadow:0 0 12px #e8b84a}
/* reflexo de luz no chão embaixo de cada estandarte */

*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:#06040a;font-family:'EB Garamond',serif;color:#eee;user-select:none}
#cena{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:transform 1.2s cubic-bezier(.6,0,.3,1),opacity 1.2s}
/* poeira dourada no fundo */
.poeira{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe8a8;opacity:0;animation:sobe var(--t) linear var(--d) infinite}
@keyframes sobe{0%{opacity:0;transform:translateY(0)}15%{opacity:.7}100%{opacity:0;transform:translateY(-60vh) translateX(var(--x))}}
h1{margin:0;font-family:var(--fa);font-weight:400;font-size:clamp(30px,4.4vw,60px);letter-spacing:.12em;color:transparent;
  background:linear-gradient(180deg,#fff4c8,#e8b84a 50%,#9a6a1a);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px #e8b84a66);
  animation:titulo 1.2s ease-out both}
@keyframes titulo{from{opacity:0;letter-spacing:.5em}to{opacity:1}}
.sub{margin-top:-18px;font-style:italic;color:#c9b48a;font-size:17px;animation:titulo 1.2s .3s ease-out both}
.parede{display:flex;gap:14px;height:min(64vh,560px);align-items:stretch;padding:0 20px}
/* estandarte */
.est{position:relative;width:min(17vw,210px);border-radius:14px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,var(--c3) 0%,var(--c1) 45%,var(--c2) 100%);
  box-shadow:0 0 0 1px #000,0 0 0 2px color-mix(in srgb,var(--c1) 70%,#fff3),0 20px 40px #000c;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.2),box-shadow .4s,filter .4s;animation:entra .8s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--e)}
@keyframes entra{from{opacity:0;transform:translateY(60px)}}
.parede:hover .est{filter:brightness(.6) saturate(.8)}
.parede .est:hover{filter:none;transform:translateY(-10px) scale(1.06);z-index:2;box-shadow:0 0 0 2px var(--brilho),0 0 50px var(--brilho),0 30px 50px #000d}
/* cor se mexendo por dentro */
.est::before{content:'';position:absolute;left:0;right:0;top:0;height:200%;background:linear-gradient(180deg,transparent 0%,color-mix(in srgb,var(--brilho) 22%,transparent) 25%,transparent 50%,color-mix(in srgb,var(--brilho) 22%,transparent) 75%,transparent 100%);animation:sobeBrilho 7s linear infinite;pointer-events:none}
@keyframes sobeBrilho{from{transform:translateY(0)}to{transform:translateY(-50%)}}
@keyframes gira{to{transform:rotate(360deg)}}
.est::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff06 0 2px,transparent 2px 6px),linear-gradient(90deg,#0006,transparent 20%,transparent 80%,#0006);pointer-events:none}
/* linha de luz vertical */
.est .linha{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,var(--brilho),transparent);
  box-shadow:0 0 22px 8px var(--brilho),0 0 60px 14px color-mix(in srgb,var(--brilho) 50%,transparent);opacity:.9;animation:pulsoLinha 2.6s ease-in-out infinite;animation-delay:var(--e)}
.est:hover .linha{opacity:1;animation-duration:1.1s}
@keyframes pulsoLinha{50%{opacity:.25}}
/* comandante no topo */
.est .cmd{position:relative;z-index:1;margin:14px auto 0;width:78%;aspect-ratio:626/457;border-radius:8px;background:#000 center/cover;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--brilho) 70%,#fff),0 8px 18px #000c;transition:transform .4s}
.est:hover .cmd{transform:translateY(-3px) scale(1.04)}
/* símbolo de mana: painel escuro + símbolo grande preenchido por textura viva da cor */
.est .simbolo{position:relative;z-index:1;width:72%;aspect-ratio:.82;margin:9% auto 0;border-radius:10px;display:grid;place-items:center;overflow:hidden;
  overflow:visible;animation:flutua 3.4s ease-in-out infinite;animation-delay:var(--e)}
.est .simbolo i{font-size:clamp(70px,8vw,112px);line-height:1;color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:var(--tex);background-size:var(--tam,200% 200%);animation:textura var(--vel,6s) linear infinite;
  filter:drop-shadow(0 0 6px var(--brilho)) drop-shadow(0 0 18px var(--brilho)) drop-shadow(0 0 0 var(--brilho));transition:filter .4s,transform .4s}
.est:hover .simbolo i{transform:scale(1.08);filter:drop-shadow(0 0 10px var(--brilho)) drop-shadow(0 0 34px var(--brilho)) drop-shadow(0 0 60px var(--brilho))}
.est .simbolo::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--brilho) 30%,transparent),transparent 60%);opacity:.4;animation:respira 2.8s ease-in-out infinite;pointer-events:none}
.est:hover .simbolo::after{opacity:.9}
@keyframes respira{50%{opacity:.15}}
@keyframes flutua{50%{transform:translateY(-6px)}}
@keyframes textura{to{background-position:var(--fim,200% 200%)}}
/* textura de cada cor */
.W .simbolo{--tex:linear-gradient(180deg,#ffffff,#fff6d0 20%,#f0c84a 35%,#ffffff 50%,#fff6d0 70%,#f0c84a 85%,#ffffff);--tam:100% 200%;--vel:8s;--fim:0 200%}
.W .simbolo i{filter:drop-shadow(0 0 2px #8a6a1a) drop-shadow(0 0 14px #fff) drop-shadow(0 0 0 #fff)}
.W.est:hover .simbolo i{filter:drop-shadow(0 0 2px #8a6a1a) drop-shadow(0 0 30px #fff) drop-shadow(0 0 60px #fff)}
.U .simbolo{--tex:linear-gradient(180deg,#0a3a7a,#2a8ae0 20%,#9fe0ff 30%,#1a5ab0 42%,#0a3a7a 50%,#2a8ae0 70%,#9fe0ff 80%,#1a5ab0 92%,#0a3a7a);--tam:100% 200%;--vel:10s;--fim:0 200%}
.B .simbolo{--tex:linear-gradient(180deg,#2a1a34,#b090d0 25%,#3a2a48 50%,#e0d0f0 75%,#2a1a34);--tam:100% 300%;--vel:9s;--fim:0 -300%}
.R .simbolo{--tex:linear-gradient(0deg,#5a0a02 0%,#d02a0a 25%,#ff7a1a 45%,#ffd04a 60%,#ff7a1a 75%,#d02a0a 90%,#5a0a02 100%);--tam:100% 220%;--vel:1.6s;--fim:0 -220%}
.G .simbolo{--tex:linear-gradient(180deg,#0a3a14,#3a9a3a 25%,#b8ff7a 40%,#2a7a2a 60%,#8ae05a 80%,#0a3a14);--tam:100% 300%;--vel:8s;--fim:0 300%}
/* nome e descrição */
.est .rot{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:14px 12px 16px;text-align:center;background:linear-gradient(0deg,#000d,#0008 60%,transparent)}
.est .rot b{display:block;font-family:var(--fa);font-weight:400;font-size:16px;letter-spacing:.14em;color:#fff;text-shadow:0 0 12px var(--brilho)}
.est .rot small{display:block;font-family:var(--ff);font-size:11px;letter-spacing:.08em;color:color-mix(in srgb,var(--brilho) 60%,#fff);margin-top:2px}
.est .rot p{margin:0;max-height:0;overflow:hidden;font-size:13.5px;line-height:1.3;color:#f0e6d0;transition:max-height .45s,margin .45s;opacity:.95}
.est:hover .rot p{max-height:120px;margin-top:8px}
.est .rot em{display:block;margin-top:8px;font-style:normal;font-family:var(--ff);font-size:11px;letter-spacing:.2em;color:var(--brilho);opacity:0;transition:opacity .3s .15s}
.est:hover .rot em{opacity:1}
/* cores */
.W{--c1:#c8c0b0;--c2:#3a3630;--c3:#f4f0e8;--brilho:#fffaf0}
.U{--c1:#2a5a9a;--c2:#0c1a34;--c3:#5a8ac8;--brilho:#6fc0ff}
.B{--c1:#3a2a40;--c2:#0a060c;--c3:#5a4a62;--brilho:#c08af0}
.R{--c1:#a8361e;--c2:#2a0a06;--c3:#d86a3a;--brilho:#ff7a3a}
.G{--c1:#2a6a34;--c2:#0a2010;--c3:#5aa060;--brilho:#7aff8a}
/* escolha: zoom no estandarte e a tela se enche da cor */
#cena.zoom{opacity:0}
#cartaCmd{position:fixed;left:50%;top:50%;width:min(300px,40vw);border-radius:14px;z-index:6;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .25s,transform .25s;box-shadow:0 0 0 2px var(--brilho,#E4C874),0 0 60px var(--brilho,#E4C874),0 30px 60px #000}
#cartaCmd.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fechar{position:fixed;top:16px;left:16px;z-index:7;font-family:var(--ff);background:#0008;border:1px solid #c9a24a88;color:#E4C874;padding:8px 18px;border-radius:9px;cursor:pointer;letter-spacing:.1em}
#fechar:hover{border-color:#E4C874}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;transition:opacity 1s}
#jornada{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
#jornada b{font-family:var(--fa);font-weight:400;font-size:clamp(26px,4vw,48px);letter-spacing:.14em;color:#fff;text-shadow:0 0 30px var(--brilho);animation:titulo 1.4s ease-out both}
#jornada p{font-style:italic;font-size:19px;color:#f0e6d0;max-width:620px;animation:titulo 1.4s .5s ease-out both}
#jornada .jBts{display:flex;gap:12px;margin-top:16px}
#jornada #jTroca{background:transparent;border-color:#ffffff55;color:#ffffffcc}
#jornada #jTroca:hover{border-color:#fff;color:#fff}
#jornada button{font-family:var(--ff);background:#0008;border:1px solid var(--brilho);color:#fff;padding:9px 26px;border-radius:9px;cursor:pointer;animation:titulo 1s 1.2s ease-out both}
</style></head><body>
<div id="fundo"></div><div class="nevoa n1"></div><div class="nevoa n2"></div><div id="veu"></div><svg id="runas" viewBox="0 0 400 400"></svg>
<div id="cena">
  <h1>Comece sua jornada</h1>
  <div class="orn"><i></i><b></b><i></i></div>
  <div class="sub">Escolha a cor do seu primeiro deck. Você vai melhorá-lo a cada batalha.</div>
  <div class="parede" id="parede"></div>
</div>
<button id="fechar">← Voltar</button><div id="flash"></div><img id="cartaCmd" alt="">
<div id="jornada"><b id="jTit"></b><p id="jTxt"></p><div class="jBts"><button id="jTroca">Escolher outra cor</button><button id="jVolta">Começar</button></div></div>
<script>
const art = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=art_crop`;
const CORES = [
  {k:'W', nome:'Branco', cmd:'Danitha Capashen, Paragon', txt:'Cavaleiros e soldados que lutam juntos. Proteção, voo e vida para aguentar a batalha.', fim:'A luz guia seus primeiros passos.'},
  {k:'U', nome:'Azul', cmd:'Tetsuko Umezawa, Fugitive', txt:'Criaturas ágeis e esquivas, mágicas para comprar cartas e atrapalhar o adversário.', fim:'O conhecimento será sua arma.'},
  {k:'B', nome:'Preto', cmd:'Yargle, Glutton of Urborg', txt:'Zumbis, sacrifício e remoção. Poder a qualquer preço, mesmo que custe vida.', fim:'Das sombras, você vai se erguer.'},
  {k:'R', nome:'Vermelho', cmd:'Valduk, Keeper of the Flame', txt:'Ataque rápido, dano direto e muita fúria. Acabe com a partida antes que eles reajam.', fim:'O fogo não espera ninguém.'},
  {k:'G', nome:'Verde', cmd:'Grunn, the Lonely King', txt:'Criaturas grandes e mana extra. A natureza cresce até esmagar quem está no caminho.', fim:'A floresta desperta com você.'}
];
document.getElementById('parede').innerHTML = CORES.map((c,i)=>`
  <div class="est ${c.k}" data-k="${c.k}" style="--e:${(.2 + i*.12).toFixed(2)}s">
    <div class="linha"></div>
    <div class="cmd" style="background-image:url('${art(c.cmd)}')"></div>
    <div class="simbolo"><i class="ms ms-${c.k.toLowerCase()}" title="${c.nome}"></i></div>
    <div class="rot"><b>${c.nome.toUpperCase()}</b><small>${c.cmd.split(',')[0]}</small><p>${c.txt}</p><em>CLIQUE PARA ESCOLHER</em></div>
  </div>`).join('');
const carta = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=normal`;
const cc = document.getElementById('cartaCmd');
document.querySelectorAll('.est .cmd').forEach(el=>{ const est = el.closest('.est'), c = CORES.find(x=>x.k===est.dataset.k);
  el.onmouseenter = ()=>{ cc.src = carta(c.cmd); cc.style.setProperty('--brilho', getComputedStyle(est).getPropertyValue('--brilho')); cc.classList.add('on'); };
  el.onmouseleave = ()=>cc.classList.remove('on'); });
// círculo de runas do fundo
(function(){ const R = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ'; let h = '<circle cx="200" cy="200" r="196" stroke-width="1"/><circle cx="200" cy="200" r="176" stroke-width=".6"/><circle cx="200" cy="200" r="120" stroke-width=".8"/>';
  h += '<path id="rc" d="M200 200 m-186 0 a186 186 0 1 1 372 0 a186 186 0 1 1 -372 0" fill="none"/><text font-size="13" font-family="serif"><textPath href="#rc" textLength="1160" lengthAdjust="spacing">' + R + R + '</textPath></text>';
  for (let i = 0; i < 6; i++){ const a = i * Math.PI / 3, b = a + Math.PI * 2 / 3; h += `<line x1="${200 + 120*Math.cos(a)}" y1="${200 + 120*Math.sin(a)}" x2="${200 + 120*Math.cos(b)}" y2="${200 + 120*Math.sin(b)}" stroke-width=".6"/>`; }
  document.getElementById('runas').innerHTML = h; })();
// poeira dourada
let p = ''; for (let i=0;i<70;i++) p += `<div class="poeira" style="left:${(Math.random()*100).toFixed(1)}vw;top:${(60+Math.random()*45).toFixed(1)}vh;--t:${(6+Math.random()*8).toFixed(1)}s;--d:${(-Math.random()*10).toFixed(1)}s;--x:${((Math.random()-.5)*80).toFixed(0)}px"></div>`;
document.body.insertAdjacentHTML('afterbegin', p);
// escolher: a câmera dá zoom no estandarte e a tela vira a cor
document.querySelectorAll('.est').forEach(el=>el.onclick = ()=>{
  const c = CORES.find(x=>x.k===el.dataset.k), r = el.getBoundingClientRect(), cena = document.getElementById('cena');
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  cena.style.transformOrigin = `${cx}px ${cy}px`; cena.style.transform = 'scale(4.5)'; cena.classList.add('zoom');
  const fl = document.getElementById('flash'), brilho = getComputedStyle(el).getPropertyValue('--brilho');
  fl.style.background = `radial-gradient(circle at ${cx}px ${cy}px, ${brilho} 0%, ${getComputedStyle(el).getPropertyValue('--c2')} 70%)`; fl.style.opacity = 1;
  setTimeout(()=>{ const j = document.getElementById('jornada'); j.style.setProperty('--brilho', brilho); document.getElementById('jTit').textContent = `Deck ${c.nome}`;
    document.getElementById('jTxt').textContent = c.fim; j.style.display = 'flex'; }, 1100);
});
let escolhida = null, ocupado = false;
const pai = m => parent.postMessage(Object.assign({campanha: true}, m), '*');
document.getElementById('fechar').onclick = () => pai({acao: 'fechar'});
document.getElementById('jVolta').onclick = () => { if (ocupado) return; ocupado = true; document.getElementById('jVolta').textContent = 'Preparando...'; pai({acao: 'escolher', cor: escolhida}); };
document.querySelectorAll('.est').forEach(el => el.addEventListener('click', () => { escolhida = el.dataset.k; document.getElementById('fechar').style.display = 'none'; }));
// mudou de ideia: a câmera volta para os estandartes
document.getElementById('jTroca').onclick = () => { if (ocupado) return;
  document.getElementById('jornada').style.display = 'none'; document.getElementById('flash').style.opacity = 0;
  const cena = document.getElementById('cena'); cena.style.transform = ''; cena.classList.remove('zoom');
  document.getElementById('fechar').style.display = ''; escolhida = null; };
// o Mesa responde se deu errado: volta para a escolha
window.addEventListener('message', e => { if (e.data && e.data.erro){ ocupado = false; document.getElementById('jVolta').textContent = 'Começar'; document.getElementById('jTxt').textContent = e.data.erro; } });
</script>
</body></html>
