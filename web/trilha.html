<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Recompensas de nível</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Cinzel:wght@700;900&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--ff:'Metamorphous',serif;--fn:'Cinzel',serif;--ouro:#E4C874;--ouro2:#c9a24a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#2a1a10,#0a0604 70%);color:#eee;font-family:'EB Garamond',serif}
h1{font-family:var(--ff);color:var(--ouro);margin:0;font-size:28px;letter-spacing:.06em}
.topo{display:flex;align-items:center;gap:22px;padding:22px 32px 8px}
.topo .av{width:64px;height:64px;flex:none}
.topo .barra{flex:1;max-width:420px}
.topo .barra b{font-family:var(--fn);font-size:15px;color:var(--ouro)}
.topo .barra small{color:#a8957d;margin-left:8px}
.prog{height:12px;border-radius:99px;background:#1a0e08;box-shadow:inset 0 1px 3px #000;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#b8862a,#ffe08a);box-shadow:0 0 10px #f0c44a88}
.sub{color:#a8957d;padding:0 32px 6px;font-size:15px}
/* ---- trilha ---- */
#trilha{position:relative;overflow-x:auto;padding:30px 40px 34px;scrollbar-width:thin;scrollbar-color:#c9a24a77 transparent;cursor:grab}
#trilha .linha{position:relative;display:flex;align-items:flex-end;gap:0;min-width:max-content;height:250px}
#trilha .eixo{position:absolute;left:0;right:0;bottom:44px;height:8px;border-radius:99px;background:#2a1a10;box-shadow:inset 0 1px 3px #000}
#trilha .eixo i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#8a5a14,#ffe08a);box-shadow:0 0 12px #f0c44a99}
.nv{position:relative;width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.nv .num{position:absolute;bottom:0;font-family:var(--fn);font-weight:900;font-size:17px;color:#a8957d}
.nv .pino{position:absolute;bottom:40px;width:16px;height:16px;border-radius:50%;background:#2a1a10;border:2px solid #6a4a24;z-index:1}
.nv.feito .pino{background:radial-gradient(circle at 35% 30%,#fff0b0,#c08a2a);border-color:#ffe08a;box-shadow:0 0 10px #f0c44a}
.nv.feito .num{color:var(--ouro)}
.nv.atual .num{color:#fff;font-size:21px;text-shadow:0 0 12px #f0c44a}
.nv.atual .pino{width:22px;height:22px;bottom:37px;background:radial-gradient(circle at 35% 30%,#fff,#ffd060);box-shadow:0 0 0 4px #f0c44a55,0 0 22px #ffd060;animation:pinoAtual 1.6s ease-in-out infinite}
@keyframes pinoAtual{50%{box-shadow:0 0 0 8px #f0c44a22,0 0 30px #ffd060}}
.premio{position:absolute;bottom:72px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.premio:hover{transform:translateY(-6px)}
.premio .val{font-family:var(--fn);font-weight:700;font-size:13px;color:var(--ouro);text-shadow:0 1px 3px #000}
.moeda{width:42px;height:42px}
.pack{width:40px;height:58px;border-radius:4px;background:linear-gradient(180deg,#0008,transparent 30%,transparent 55%,#000d),url('campanha/artes/krenko.jpg') 42% 30%/cover;box-shadow:0 0 0 2px #c9a24a,0 6px 12px #000a;position:relative}
.pack::after{content:'M';position:absolute;top:3px;left:0;right:0;text-align:center;font-family:var(--ff);font-size:13px;color:#ffe08a;text-shadow:0 1px 2px #000}
.nv.feito .premio{filter:saturate(.5) brightness(.65)}
.nv.feito .premio::after{content:'✓';position:absolute;top:-6px;right:-10px;width:20px;height:20px;border-radius:50%;background:#3a9a5a;color:#fff;font-size:12px;display:grid;place-items:center}
/* marcos (10, 20, 30, 40, 50) */
.nv.marco{width:150px}
.nv.marco .premio{bottom:66px}
.cartaoMarco{width:128px;padding:10px 8px 9px;border-radius:12px;text-align:center;background:linear-gradient(180deg,#2a1a10,#140a06);border:1px solid var(--cm);box-shadow:0 0 18px color-mix(in srgb,var(--cm) 45%,transparent),0 10px 20px #000a;cursor:pointer}
.cartaoMarco .vis{height:84px;display:grid;place-items:center;margin-bottom:6px}
.cartaoMarco b{display:block;font-family:var(--ff);font-size:13px;color:#fff;line-height:1.15}
.cartaoMarco small{display:block;font-size:12px;color:#c9b89a;line-height:1.2;margin-top:3px}
.m10{--cm:#c98a4a}.m20{--cm:#d0d8e0}.m30{--cm:#ffd060}.m40{--cm:#ff7a3a}.m50{--cm:#c890ff}
.nv.marco .num{font-size:20px;color:var(--ouro)}
/* mini playmat, costas de carta, cartas à escolha */
.miniMat{width:96px;height:58px;border-radius:6px;background:radial-gradient(ellipse at 50% 120%,#ff8a3a55,transparent 60%),linear-gradient(160deg,#3a1a0c,#120806);box-shadow:inset 0 0 0 1px #c98a4a,0 4px 10px #000;position:relative;overflow:hidden}
.miniMat i{position:absolute;bottom:-4px;width:3px;height:3px;border-radius:50%;background:#ffb050;box-shadow:0 0 6px #ff8a2a;animation:sobe 2.6s linear infinite}
@keyframes sobe{to{transform:translateY(-70px);opacity:0}}
.costas{width:52px;height:74px;border-radius:5px;background:radial-gradient(ellipse at 50% 50%,#3a2a12,#0a0604 70%);box-shadow:0 0 0 2px #c9a24a,0 4px 10px #000;display:grid;place-items:center;font-family:var(--ff);font-size:28px;color:transparent;background-clip:border-box}
.costas span{background:linear-gradient(180deg,#fff4c8,#e8b84a 45%,#8a5a18);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:var(--ff);font-size:30px}
.escolha{display:flex}
.escolha div{width:34px;height:48px;border-radius:4px;margin-left:-14px;background:#000 center/cover;box-shadow:0 0 0 1.5px var(--cm),0 3px 8px #000}
.escolha div:first-child{margin-left:0;transform:rotate(-10deg)}.escolha div:last-child{transform:rotate(10deg)}
.escolha div:nth-child(2){transform:translateY(-6px);z-index:1}
/* ---- seção das molduras ---- */
.secao{padding:10px 32px 30px}
.secao h2{font-family:var(--ff);color:var(--ouro);font-size:20px;margin:10px 0 14px}
.molduras{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-end}
.molduras .it{display:flex;flex-direction:column;align-items:center;gap:10px}
.molduras .it .av{width:120px;height:120px}
.molduras .it b{font-family:var(--fn);font-size:14px;color:var(--ouro)}
.molduras .it small{font-size:13px;color:#a8957d}
.titulo{font-family:var(--ff);font-size:12px;letter-spacing:.2em;background:linear-gradient(90deg,#c890ff,#ffe08a,#5ad0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* detalhe do marco */
#det{margin:0 32px 30px;padding:18px 22px;border-radius:14px;background:linear-gradient(180deg,#1e140c,#120a06);border:1px solid #6a4a24;display:none;gap:22px;align-items:center}
#det.on{display:flex}
#det h3{margin:0 0 6px;font-family:var(--ff);color:var(--ouro);font-size:20px}
#det p{margin:0;color:#d9c8b0;font-size:16px;line-height:1.45}

/* ---- produção: barra do topo, botões, escolha de carta ---- */
.fechar{font-family:var(--ff);background:#0008;border:1px solid #c9a24a88;color:var(--ouro);padding:8px 16px;border-radius:10px;cursor:pointer;margin-left:auto}
.fechar:hover{border-color:var(--ouro)}
.molduras .it{cursor:pointer;padding:10px 12px 12px;border-radius:14px;border:1px solid transparent;transition:background .2s,border-color .2s}
.molduras .it:hover{background:#ffffff08}
.molduras .it.bloq{cursor:default;filter:grayscale(1) brightness(.45)}
.molduras .it.bloq:hover{background:none}
.molduras .it.equip{border-color:#c9a24a;background:#c9a24a14}
.molduras .it .eq{font-family:var(--ff);font-size:11px;letter-spacing:.12em;color:#7ad08a;min-height:14px}
.escolhas{display:flex;gap:14px;flex-wrap:wrap;margin:0 32px 18px}
.escolhas button{font-family:var(--ff);font-size:16px;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;color:#2a1606;background:linear-gradient(180deg,#fff0a8,#f0c050 40%,#c08a2a);box-shadow:0 0 0 2px #6a4a14,0 4px 0 #4a3008,0 0 22px #f0c44a55;animation:chama 1.8s ease-in-out infinite}
.escolhas button.mit{background:linear-gradient(180deg,#ffd0a0,#ff8a3a 45%,#c0401a);color:#fff;box-shadow:0 0 0 2px #6a1a08,0 4px 0 #4a1006,0 0 22px #ff6a1a77}
@keyframes chama{50%{filter:brightness(1.15)}}
#esc{position:fixed;inset:0;z-index:20;background:#070403f0;display:none;flex-direction:column;padding:22px 30px}
#esc.on{display:flex}
#esc .cab{display:flex;align-items:center;gap:16px;margin-bottom:14px}
#esc h2{margin:0;font-family:var(--ff);color:var(--ouro);font-size:22px}
#esc input{flex:1;max-width:340px;background:#1a0e08;border:1px solid #8a5a2a;border-radius:10px;color:#f0e0c0;font:16px 'EB Garamond';padding:8px 14px;outline:0}
#esc .grade{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;padding:4px 4px 20px;scrollbar-width:thin;scrollbar-color:#c9a24a77 transparent}
#esc .c{position:relative;cursor:pointer;border-radius:9px;transition:transform .15s}
#esc .c:hover{transform:translateY(-4px) scale(1.03)}
#esc .c img{width:100%;border-radius:9px;display:block;box-shadow:0 8px 18px #000c}
#esc .c small{position:absolute;left:6px;bottom:6px;font-family:var(--fn);font-weight:700;font-size:11px;background:#000c;color:#d9c8b0;padding:2px 7px;border-radius:6px}
#esc .c.sel img{box-shadow:0 0 0 3px #ffd060,0 0 30px #ffd060}
#esc .conf{position:fixed;right:30px;bottom:24px;font-family:var(--ff);font-size:18px;padding:12px 26px;border-radius:12px;border:0;cursor:pointer;color:#2a1606;background:linear-gradient(180deg,#fff0a8,#f0c050 40%,#c08a2a);box-shadow:0 0 0 2px #6a4a14,0 4px 0 #4a3008;display:none}
#msg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1a0e08ee;border:1px solid #c9a24a;color:#f0e0c0;padding:9px 18px;border-radius:10px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
</style></head><body>
<div class="topo"><div id="meuAv"></div><div><h1>Recompensas de nível</h1><div class="barra" id="barra"></div></div><button class="fechar" id="fechar">Voltar</button></div>
<div class="sub">Cada nível dá Ouro; de 3 em 3 níveis, um booster. Nos níveis 10, 20, 30, 40 e 50, prêmios que não se compram. Clique num prêmio grande para ver os detalhes.</div>
<div class="escolhas" id="escolhas"></div>
<div id="trilha"><div class="linha" id="linha"></div></div>
<div id="det"></div>
<div class="secao"><h2>Molduras de avatar</h2><div class="molduras" id="molduras"></div></div>
<div id="esc"><div class="cab"><button class="fechar" id="escVoltar" style="margin:0">Voltar</button><h2 id="escTit"></h2><input id="escBusca" placeholder="Pesquisar carta..."></div><div class="grade" id="escGrade"></div><button class="conf" id="escOk"></button></div>
<div id="msg"></div>
<script src="molduras.js"></script>
<script>
const MOEDA = '<svg class="moeda" viewBox="0 0 24 24"><defs><radialGradient id="mg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#f0c44a"/><stop offset="1" stop-color="#9a6a18"/></radialGradient></defs><circle cx="12" cy="12" r="10.5" fill="url(#mg)" stroke="#7a5414" stroke-width="1.2"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="#b8862a" stroke-width="1"/><path d="M8 16V8.4l4 4.6 4-4.6V16" fill="none" stroke="#7a5414" stroke-width="1.8" stroke-linejoin="round"/></svg>';
const art = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n)}&format=image&version=art_crop`;
const imgCarta = c => `https://api.scryfall.com/cards/${c.set.toLowerCase()}/${encodeURIComponent(c.num)}?format=image&version=normal`;
const pai = m => parent.postMessage(Object.assign({trilha: true}, m), '*');
let D = null, FOTO = '', SEM = {cor:'#A487C4', letra:'?'};
const fotoHtml = () => FOTO ? `<div style="background:url('${FOTO}') center/cover"></div>` : `<div style="background:${SEM.cor};display:grid;place-items:center;font-family:Metamorphous,serif;font-size:2em;color:#1a1208">${SEM.letra}</div>`;
const fmt = n => Number(n||0).toLocaleString('pt-BR');
function aviso(t){ const m = document.getElementById('msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(aviso.t); aviso.t = setTimeout(()=>m.style.opacity = 0, 2600); }
const miniMat = `<div class="miniMat">${[10,25,40,55,70,85].map((x,i)=>`<i style="left:${x}%;animation-delay:${-i*.45}s"></i>`).join('')}</div>`;
const MARCOS = {
  10: {t:'Playmat "Brasas de Akros"', s:'animado + moldura de Bronze', vis:()=>miniMat,
       d:'Um playmat exclusivo e animado: pedra vulcânica com rachaduras de lava, brasas subindo e um selo de runas. Ganha também a moldura de <b>Bronze</b> e 300 de Ouro.'},
  20: {t:'Costas de carta', s:'personalizadas + moldura de Prata', vis:()=>'<div class="costas"><span>M</span></div>',
       d:'Libera trocar as costas das suas cartas: a versão preta e dourada da Mesa ou <b>qualquer imagem que você quiser</b>. Ganha também a moldura de <b>Prata</b>.'},
  30: {t:'Rara à sua escolha', s:'+ moldura de Ouro', vis:()=>`<div class="escolha"><div style="background-image:url('${art('Goblin Chieftain')}')"></div><div style="background-image:url('${art('Krenko, Mob Boss')}')"></div><div style="background-image:url('${art('Serra Angel')}')"></div></div>`,
       d:'Escolha <b>qualquer rara</b> do mundo e ela vai para a sua coleção. Ganha também a moldura de <b>Ouro</b>: anel duplo gravado, com um diamante no topo.'},
  40: {t:'Moldura em Chamas', s:'animada + entrada de comandante + booster', vis:()=>molduraHtml('40', fotoHtml(), 70),
       d:'Moldura <b>animada</b> com um anel de fogo vivo, uma nova <b>entrada do comandante</b> em chamas douradas e mais um booster.'},
  50: {t:'Lenda da Mesa', s:'mítica à escolha + título + moldura Lendária', vis:()=>molduraHtml('50', fotoHtml(), 70),
       d:'O grande prêmio: <b>qualquer mítica</b> à sua escolha, o título <span class="tituloLenda">LENDA DA MESA</span> embaixo do seu nome e a moldura <b>Lendária</b>: anel de energia viva, estrelas girando e orbes de luz em órbita.'},
};
function premio(n){
  if (MARCOS[n]){ const m = MARCOS[n]; return `<div class="premio"><div class="cartaoMarco m${n}" data-n="${n}"><div class="vis">${m.vis()}</div><b>${m.t}</b><small>${m.s}</small></div></div>`; }
  if (n === 1) return `<div class="premio">${MOEDA}<span class="val">500</span></div>`;
  if (n % 3 === 0) return `<div class="premio"><div class="pack"></div><span class="val">Booster</span></div>`;
  return `<div class="premio">${MOEDA}<span class="val">150</span></div>`;
}
function desenhar(){
  const ni = D.nivel, atual = ni.nivel;
  const meu = fotoHtml();
  document.getElementById('meuAv').innerHTML = molduraHtml(D.moldura, meu, 72);
  document.getElementById('barra').innerHTML = `<b>Nível ${atual}</b><small>${fmt(ni.noNivel)} / ${fmt(ni.paraSubir)} XP para o nível ${atual+1}</small><div class="prog"><i style="width:${Math.min(100, ni.noNivel/ni.paraSubir*100).toFixed(1)}%"></i></div>${D.titulo ? `<div class="tituloLenda" style="font-size:12px;margin-top:6px">${D.titulo.toUpperCase()}</div>` : ''}`;
  const L = document.getElementById('linha');
  L.innerHTML = '<div class="eixo"><i id="eixoFeito"></i></div>' + Array.from({length:50}, (_, i)=>{ const n = i + 1;
    return `<div class="nv${MARCOS[n]?' marco':''}${n<=D.nivelPremiado && n<atual?' feito':n===atual?' atual':''}">${premio(n)}<div class="pino"></div><div class="num">${n}</div></div>`; }).join('');
  const nos = [...L.querySelectorAll('.nv')], alvo = nos[Math.min(50, atual)-1];
  document.getElementById('eixoFeito').style.width = (alvo.offsetLeft + alvo.offsetWidth/2) + 'px';
  const tr = document.getElementById('trilha'); tr.scrollLeft = alvo.offsetLeft - 260;
  document.querySelectorAll('.cartaoMarco').forEach(c => c.onclick = () => { const m = MARCOS[c.dataset.n], d = document.getElementById('det');
    const n = +c.dataset.n, tem = D.nivelPremiado >= n;
    d.innerHTML = `<div style="flex:none">${m.vis()}</div><div><h3>Nível ${n}: ${m.t}${tem ? ' <small style="color:#7ad08a;font-size:14px">desbloqueado</small>' : ''}</h3><p>${m.d}</p></div>`; d.classList.add('on'); d.scrollIntoView({behavior:'smooth', block:'nearest'}); });
  // escolhas pendentes
  document.getElementById('escolhas').innerHTML = (D.escolhaRara > 0 ? `<button id="eRara">Escolher sua rara${D.escolhaRara > 1 ? ` (${D.escolhaRara})` : ''}</button>` : '') + (D.escolhaMitica > 0 ? `<button class="mit" id="eMit">Escolher sua mítica${D.escolhaMitica > 1 ? ` (${D.escolhaMitica})` : ''}</button>` : '');
  const eR = document.getElementById('eRara'), eM = document.getElementById('eMit');
  if (eR) eR.onclick = () => abrirEscolha('rara'); if (eM) eM.onclick = () => abrirEscolha('mitica');
  // molduras: clicar equipa
  const des = new Set(D.desbloqueios || []);
  document.getElementById('molduras').innerHTML = ['', '10', '20', '30', '40', '50'].map(k => {
    const ok = !k || des.has('moldura:' + k), eq = (D.moldura || '') === k;
    return `<div class="it${ok?'':' bloq'}${eq?' equip':''}" data-k="${k}">${molduraHtml(k, meu, 110)}<b>${MOLDURAS[k]}</b><small>${k ? `nível ${k}` : 'todos'}</small><span class="eq">${eq ? 'EQUIPADA' : ok ? '' : 'BLOQUEADA'}</span></div>`; }).join('');
  document.querySelectorAll('.molduras .it').forEach(it => it.onclick = () => { if (it.classList.contains('bloq') || it.classList.contains('equip')) return; pai({acao:'moldura', moldura: it.dataset.k}); });
}
// escolha da rara/mítica
let escFaixa = '', escSel = null, escLista = [];
function abrirEscolha(faixa){ escFaixa = faixa; escSel = null; pai({acao:'cartas', faixa}); document.getElementById('escTit').textContent = faixa === 'rara' ? 'Escolha uma rara' : 'Escolha uma mítica'; document.getElementById('esc').classList.add('on'); document.getElementById('escGrade').innerHTML = '<div style="color:#a8957d">Carregando…</div>'; }
function desenharEscolha(){
  const q = document.getElementById('escBusca').value.trim().toLowerCase();
  document.getElementById('escGrade').innerHTML = escLista.filter(c => !q || c.nome.toLowerCase().includes(q) || (c.tipo||'').toLowerCase().includes(q)).map((c, i) =>
    `<div class="c${escSel === c ? ' sel' : ''}" data-i="${escLista.indexOf(c)}"><img loading="lazy" src="${imgCarta(c)}" alt="${c.nome}">${c.tenho ? `<small>você tem ${c.tenho}</small>` : ''}</div>`).join('');
  document.querySelectorAll('#escGrade .c').forEach(el => el.onclick = () => { escSel = escLista[+el.dataset.i]; desenharEscolha(); const b = document.getElementById('escOk'); b.style.display = 'block'; b.textContent = `Ficar com ${escSel.nome}`; });
}
document.getElementById('escBusca').oninput = desenharEscolha;
document.getElementById('escVoltar').onclick = () => document.getElementById('esc').classList.remove('on');
document.getElementById('escOk').onclick = () => { if (escSel) pai({acao:'escolher', faixa: escFaixa, nome: escSel.nome, set: escSel.set, num: escSel.num}); };
document.getElementById('fechar').onclick = () => pai({acao:'fechar'});
// arrastar a trilha
const tr = document.getElementById('trilha'); let arr = null;
tr.onpointerdown = e => { arr = {x: e.clientX, s: tr.scrollLeft}; };
addEventListener('pointerup', () => arr = null); addEventListener('pointermove', e => { if (arr) tr.scrollLeft = arr.s - (e.clientX - arr.x); });
tr.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)){ tr.scrollLeft += e.deltaY; e.preventDefault(); } }, {passive:false});
addEventListener('message', e => { const d = e.data; if (!d) return;
  if (d.dados){ D = d.dados; if (d.foto !== undefined) FOTO = d.foto; if (d.semFoto) SEM = d.semFoto; desenhar(); }
  if (d.cartas){ escLista = d.cartas; desenharEscolha(); }
  if (d.escolhida){ document.getElementById('esc').classList.remove('on'); aviso(`${d.escolhida} foi para a sua coleção!`); }
  if (d.erro) aviso(d.erro);
});
pai({acao:'pronta'});
</script></body></html>
