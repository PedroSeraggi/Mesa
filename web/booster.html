<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Abrir booster</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:'EB Garamond',serif;color:#eee;background:radial-gradient(ellipse at 50% 45%,#2a1638f2 0%,#120a18f2 55%,#06030af2 100%);user-select:none}
#palco{position:absolute;inset:0}
#palco.treme{animation:treme .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes treme{10%{transform:translate(-8px,5px)}25%{transform:translate(9px,-6px)}40%{transform:translate(-7px,-4px)}55%{transform:translate(6px,6px)}70%{transform:translate(-4px,3px)}85%{transform:translate(3px,-2px)}}
/* encaixe no centro (onde se solta o pacote) */
.encaixe{position:absolute;left:50%;top:46%;width:250px;height:250px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#3a2450 0%,#1a0e24 60%,transparent 72%);box-shadow:inset 0 0 0 3px #c9a24a55,0 0 60px #7a4ad044;transition:box-shadow .3s}
.encaixe::before{content:'';position:absolute;inset:18px;border-radius:50%;border:2px dashed #c9a24a55;animation:gira 20s linear infinite}
.encaixe.ativo{box-shadow:inset 0 0 0 3px #ffd04a,0 0 90px #ffb84a88}
@keyframes gira{to{transform:rotate(360deg)}}
.dica{position:absolute;left:0;right:0;bottom:8%;text-align:center;font-family:var(--ff);letter-spacing:.2em;font-size:13px;color:#d9c8e8b0;text-transform:uppercase}
/* pacote 3D: embalagem metalizada preta e dourada com a logo da Mesa; inclina seguindo o mouse */
.pacote{position:absolute;width:170px;height:270px;z-index:5;cursor:grab;perspective:900px}
.pacote:active{cursor:grabbing}
.pacote .pkt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,-18deg));transition:transform .12s}
.pacote.flutua .pkt{animation:flutua 2.6s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:rotateX(4deg) rotateY(-18deg) translateY(0)}50%{transform:rotateX(-2deg) rotateY(-10deg) translateY(-10px)}}
.pkt .frente{position:absolute;inset:0;transform:translateZ(9px);
  clip-path:polygon(0 3%,4% 0,8% 3%,12% 0,16% 3%,20% 0,24% 3%,28% 0,32% 3%,36% 0,40% 3%,44% 0,48% 3%,52% 0,56% 3%,60% 0,64% 3%,68% 0,72% 3%,76% 0,80% 3%,84% 0,88% 3%,92% 0,96% 3%,100% 0,100% 97%,96% 100%,92% 97%,88% 100%,84% 97%,80% 100%,76% 97%,72% 100%,68% 97%,64% 100%,60% 97%,56% 100%,52% 97%,48% 100%,44% 97%,40% 100%,36% 97%,32% 100%,28% 97%,24% 100%,20% 97%,16% 100%,12% 97%,8% 100%,4% 97%,0 100%);
  background:
    linear-gradient(105deg,transparent 30%,#fff7d055 var(--brilho,45%),transparent calc(var(--brilho,45%) + 14%)),
    linear-gradient(180deg,#050302cc 0%,transparent 26%,transparent 52%,#050302ee 80%,#050302 100%),
    var(--arte,radial-gradient(ellipse at 50% 38%,#3a2a12 0%,#120c06 55%,#050302 100%)) var(--foco,50%) 30%/cover no-repeat;
  box-shadow:inset 0 0 0 2px #c9a24a}
.pkt .frente::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0009,transparent 14%,transparent 86%,#0009),linear-gradient(#0008,transparent 10%,transparent 90%,#0008)}
.pkt .borda{position:absolute;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#d9b45a 0 3px,#7a5a20 3px 6px);transform:translateZ(9.5px)}
.pkt .borda.cima{top:4px}.pkt .borda.baixo{bottom:4px}
.pkt .logo{position:absolute;left:0;right:30px;top:9%;text-align:center;transform:translateZ(10px)}
.pkt .logo b{display:block;font-family:var(--ff);font-weight:800;font-size:40px;line-height:1;color:transparent;background:linear-gradient(180deg,#fff4c8,#e8b84a 45%,#8a5a18);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px #c9962e88)}
.pkt .logo span{display:block;font-family:var(--ff);font-weight:800;font-size:11px;letter-spacing:.45em;text-shadow:0 1px 3px #000;margin-top:2px;margin-left:.45em;color:#e8c874}
.pkt .info{position:absolute;left:14px;top:26px;font-family:var(--ff);font-size:8.5px;letter-spacing:.18em;color:#c9a24a;transform:translateZ(10px)}
.pkt .faixa{position:absolute;right:10px;top:26px;bottom:26px;width:22px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;
  font-family:var(--ff);font-weight:800;font-size:10px;letter-spacing:.3em;color:#120c06;background:linear-gradient(90deg,#f1d98a,#b8862a);transform:translateZ(10px);border-radius:2px}
.pkt .nomeMundo{position:absolute;left:12px;right:42px;bottom:46px;padding:5px 4px;text-align:center;font-family:var(--ff);font-weight:800;font-size:12.5px;letter-spacing:.12em;line-height:1.1;color:#2a1606;
  background:linear-gradient(180deg,#fff0b0,#e0b04a 50%,#a87a20);border:1px solid #5a3a0a;border-radius:3px;box-shadow:0 2px 6px #000c,inset 0 1px 0 #fff8;transform:translateZ(10px)}
.pkt .rodape{position:absolute;left:0;right:30px;bottom:30px;text-align:center;font-family:var(--ff);font-size:9px;letter-spacing:.3em;color:#e8c87499;transform:translateZ(10px)}
.pkt .verso{position:absolute;inset:0;transform:rotateY(180deg) translateZ(9px);background:linear-gradient(160deg,#1a120a,#050302);box-shadow:inset 0 0 0 2px #8a6a28}
.pkt .lado{position:absolute;top:3%;bottom:3%;width:18px;background:linear-gradient(90deg,#2a1d0e,#0a0703)}
.pkt .lado.e{left:-9px;transform:rotateY(-90deg)}.pkt .lado.d{right:-9px;transform:rotateY(90deg)}
.pacote.explode{pointer-events:none;animation:explode .55s ease-in forwards}
@keyframes explode{30%{transform:scale(1.1) rotate(-3deg)}60%{transform:scale(1.18) rotate(3deg);filter:brightness(1.6)}100%{transform:scale(1.6);opacity:0;filter:brightness(4)}}
.clarao{position:absolute;left:50%;top:46%;width:80vmin;height:80vmin;border-radius:50%;transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,#fff6d0 0%,#ffcf6a88 25%,transparent 65%);animation:clarao .9s ease-out forwards;pointer-events:none}
@keyframes clarao{20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
/* cartas viradas */
.carta{position:absolute;width:118px;aspect-ratio:63/88;perspective:900px;cursor:pointer;transform:translate(-50%,-50%) scale(.2);opacity:0;left:50%;top:46%;
  transition:left .6s cubic-bezier(.2,.9,.3,1.1),top .6s cubic-bezier(.2,.9,.3,1.1),transform .6s cubic-bezier(.2,.9,.3,1.1),opacity .3s;transition-delay:var(--d)}
.carta.posta{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}
.carta .gira{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.carta.virada .gira{transform:rotateY(180deg)}
.carta .lado{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#000 center/cover;box-shadow:0 8px 16px #000c}
.carta .costas{background-image:url('https://backs.scryfall.io/large/0/a/0aeebaf5-8c7d-4636-9e82-8c27447861f7.jpg')}
.carta .frente{transform:rotateY(180deg)}
/* brilho da raridade: aparece ao passar o mouse na carta virada para baixo (como no Hearthstone) */
.carta .aura{position:absolute;inset:-6px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 0 0 2px var(--cor),0 0 26px 8px var(--cor)}
.carta:not(.virada):hover .aura{opacity:1;animation:pulsa 1s ease-in-out infinite}
.carta:not(.virada):hover{z-index:3}
@keyframes pulsa{50%{box-shadow:0 0 0 2px var(--cor),0 0 40px 14px var(--cor)}}
.carta.rara:not(.virada) .aura,.carta.mitica:not(.virada) .aura,.carta.especial:not(.virada) .aura{opacity:1;animation:pulsa 1.6s ease-in-out infinite}
.carta .raios{position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,var(--cor) 0deg 5deg,transparent 5deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 62%);mask-image:radial-gradient(circle,#000 18%,transparent 62%);
  animation:giraRaios 9s linear infinite;transition:opacity .4s}
.carta.rara:not(.virada) .raios,.carta.especial:not(.virada) .raios{opacity:.45}
.carta.mitica:not(.virada) .raios{opacity:.7;animation-duration:5s}
.carta:not(.virada):hover .raios{opacity:.9}
@keyframes giraRaios{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* 2) virada extravagante: a carta treme, junta luz, e explode em clarão */
.carta.carrega{z-index:6}
.carta.carrega .gira{animation:carrega .6s ease-in forwards}
@keyframes carrega{0%{transform:none}20%{transform:translateY(-6px) rotate(-2deg) scale(1.05)}40%{transform:translateY(-10px) rotate(2deg) scale(1.1)}60%{transform:translateY(-14px) rotate(-3deg) scale(1.14)}80%{transform:translateY(-18px) rotate(3deg) scale(1.18)}100%{transform:translateY(-20px) scale(1.22);filter:brightness(2.2)}}
.carta.carrega .raios{opacity:1;animation-duration:1.2s}
.carta .luz{position:absolute;inset:-2px;border-radius:7px;background:radial-gradient(circle at 50% 45%,#fff 0%,#fff8d8 30%,var(--cor) 60%,transparent 80%);opacity:0;pointer-events:none;z-index:2}
.carta.revela .luz{animation:luz 1.1s ease-out forwards}
@keyframes luz{0%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1)}}
.carta.revela .raios{opacity:1;animation:explodeRaios 1.2s ease-out forwards}
@keyframes explodeRaios{0%{transform:translate(-50%,-50%) scale(.4) rotate(0)}100%{transform:translate(-50%,-50%) scale(2.2) rotate(90deg);opacity:0}}
.carta.revela{z-index:6}
.carta.comum{--cor:#ffffff44}.carta.incomum{--cor:#9fd0ffaa}.carta.rara{--cor:#ffd04acc}.carta.mitica{--cor:#ff6a1add}.carta.especial{--cor:#b07ae0cc}
/* explosão ao virar */
.carta .estouro{position:absolute;left:50%;top:50%;width:260px;height:260px;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;background:radial-gradient(circle,var(--cor) 0%,transparent 65%)}
.carta.virada .estouro{animation:estouro .7s ease-out}
@keyframes estouro{0%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.carta.mitica.virada .estouro{animation:estouro 1s ease-out;width:520px;height:520px}
/* selo de nível na carta virada */
.carta .selo{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%) rotateY(180deg);backface-visibility:hidden;opacity:0;white-space:nowrap;
  font-family:var(--ff);font-weight:800;font-size:9.5px;letter-spacing:.16em;padding:2px 9px;border-radius:999px;box-shadow:0 2px 6px #000a}
.carta.virada .selo{opacity:1;transform:translateX(-50%);transition:opacity .3s .35s}
.comum .selo{background:#5a5650;color:#e8e2d8}
.incomum .selo{background:linear-gradient(#d8e4ee,#8a9aa8);color:#1a2430}
.rara .selo{background:linear-gradient(#ffe48a,#b8862a);color:#2a1a04}
.mitica .selo{background:linear-gradient(#ffb04a,#d0401a);color:#fff;box-shadow:0 0 12px #ff6a1a}
.especial .selo{background:linear-gradient(#d0a8f0,#7a4ab0);color:#fff}
.carta .nova{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:3;padding:2px 16px 3px;font-family:var(--ff);font-weight:800;font-size:10.5px;letter-spacing:.06em;color:#3a1a02;
  background:linear-gradient(180deg,#fff2b0,#ffc04a 55%,#e07a10);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);opacity:0;filter:drop-shadow(0 0 6px #ffb040)}
.carta.virada .nova{opacity:1;transition:opacity .3s .4s}
.carta.ehNova.virada .frente{box-shadow:0 0 0 2px #ffb040,0 0 18px 4px #ff9a20cc,0 8px 16px #000c;animation:novaBrilho 2.2s ease-in-out infinite}
@keyframes novaBrilho{50%{box-shadow:0 0 0 2px #ffd070,0 0 28px 8px #ffa830ee,0 8px 16px #000c}}
.faisca{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--cor);box-shadow:0 0 8px var(--cor);pointer-events:none;animation:faisca .9s ease-out forwards}
@keyframes faisca{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--x),var(--y))}}
#zoom{position:fixed;inset:0;z-index:20;background:#06030ad0;display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:zIn .2s ease-out}
#zoom img{width:min(340px,80vw);border-radius:16px;box-shadow:0 0 0 2px var(--cor,#c9a24a),0 0 40px var(--cor,#c9a24a),0 20px 50px #000;animation:zImg .25s cubic-bezier(.3,1.4,.5,1)}
@keyframes zIn{from{opacity:0}}@keyframes zImg{from{transform:scale(.6)}}
#pronto{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font-family:var(--ff);font-size:16px;padding:10px 46px;border-radius:9px;border:1px solid #E4C874;background:linear-gradient(#e0b050,#a87a28);color:#1a1008;cursor:pointer;display:none}
#novo{position:fixed;left:14px;top:12px;font-family:var(--ff);background:#3a2a18;border:1px solid #E4C874;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;z-index:10}
</style></head><body>

<div id="palco"></div>
<script>
// o pacote vem da Mesa (que abriu esta tela por cima dela)
let PACOTE = [], MUNDO = 'MUNDO 1', NOME_MUNDO = '';
const img = c => c.img;
const NOMES = {comum:'COMUM', incomum:'INCOMUM', rara:'RARA', mitica:'MÍTICA', especial:'ESPECIAL'};
let AC = null; const ac = ()=> AC || (AC = new (window.AudioContext||window.webkitAudioContext)());
function bum(tom=1, vol=.6){ return; try { const a = new Audio('sons/impacto/bum.ogg'); a.volume = vol; a.playbackRate = tom; a.preservesPitch = false; a.play().catch(()=>{}); } catch(e){} }
function brilhoSom(nivel){   // "plim" que sobe com a raridade (desligado por enquanto)
  return; try { const a = ac(), t = a.currentTime; const notas = {comum:[523], incomum:[523,659], rara:[523,659,784], especial:[587,740,880], mitica:[523,659,784,1046]}[nivel];
    notas.forEach((hz,k)=>{ const o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = hz; const t0 = t + k*.06;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.12, t0+.02); g.gain.exponentialRampToValueAtTime(.001, t0+.6); o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+.7); }); } catch(e){}
}
function montar(){
  const palco = document.getElementById('palco');
  palco.innerHTML = `<div class="encaixe" id="encaixe"></div><div class="pacote flutua" id="pacote" style="left:10%;top:50%"><div class="pkt">
      <div class="verso"></div><div class="lado e"></div><div class="lado d"></div>
      <div class="frente"></div><div class="borda cima"></div><div class="borda baixo"></div>
      <div class="info">15 CARTAS</div><div class="faixa">${MUNDO}</div>
      <div class="logo"><b>M</b><span>MESA</span></div>${NOME_MUNDO ? `<div class="nomeMundo">${NOME_MUNDO}</div>` : ''}<div class="rodape">BOOSTER</div></div></div>
    <div class="dica" id="dica">Arraste o pacote até o círculo</div><button id="pronto">Pronto</button>`;
  const pac = document.getElementById('pacote'), enc = document.getElementById('encaixe');
  let arrastando = false, ox = 0, oy = 0;
  pac.onpointerdown = ev=>{ arrastando = true; pac.classList.remove('flutua'); const r = pac.getBoundingClientRect(); ox = ev.clientX - r.left; oy = ev.clientY - r.top; pac.setPointerCapture(ev.pointerId); };
  const pkt = pac.querySelector('.pkt');
  palco.onmousemove = ev=>{ if (arrastando || !document.getElementById('pacote')) return; const r = pac.getBoundingClientRect();
    const dx = (ev.clientX - (r.left + r.width/2)) / innerWidth, dy = (ev.clientY - (r.top + r.height/2)) / innerHeight;
    pkt.style.setProperty('--ry', (-18 + dx*50) + 'deg'); pkt.style.setProperty('--rx', (-dy*30) + 'deg'); pkt.querySelector('.frente').style.setProperty('--brilho', (45 + dx*60) + '%'); };
  pac.onpointermove = ev=>{ if (!arrastando) return;
    pkt.style.setProperty('--ry', (ev.movementX * 2) + 'deg'); pkt.style.setProperty('--rx', (-ev.movementY * 2) + 'deg'); pac.style.left = (ev.clientX - ox) + 'px'; pac.style.top = (ev.clientY - oy) + 'px';
    const e = enc.getBoundingClientRect(), d = Math.hypot(ev.clientX - (e.left + e.width/2), ev.clientY - (e.top + e.height/2)); enc.classList.toggle('ativo', d < 130); };
  pac.onpointerup = ev=>{ arrastando = false; const e = enc.getBoundingClientRect(), d = Math.hypot(ev.clientX - (e.left + e.width/2), ev.clientY - (e.top + e.height/2));
    if (d < 130){ pac.style.left = (e.left + e.width/2 - 85) + 'px'; pac.style.top = (e.top + e.height/2 - 135) + 'px'; abrir(); } else { enc.classList.remove('ativo'); pac.classList.add('flutua'); } };
  pac.ondblclick = ()=>{ const e = enc.getBoundingClientRect(); pac.style.left = (e.left + e.width/2 - 85) + 'px'; pac.style.top = (e.top + e.height/2 - 135) + 'px'; abrir(); };
}
function abrir(){
  const palco = document.getElementById('palco'), pac = document.getElementById('pacote');
  pac.onpointerdown = pac.onpointermove = pac.onpointerup = pac.ondblclick = null;
  document.getElementById('dica').textContent = '';
  pac.classList.add('explode'); bum(1.2, .5); palco.onmousemove = null;
  setTimeout(()=>pac.remove(), 600);   // some de verdade: não fica por cima das cartas roubando o mouse
  setTimeout(()=>{
    palco.insertAdjacentHTML('beforeend', '<div class="clarao"></div>');
    palco.classList.remove('treme'); void palco.offsetWidth; palco.classList.add('treme');
    document.getElementById('encaixe').style.opacity = .25;
    // posições: as 10 comuns numa faixa em cima, as 5 melhores num arco embaixo (como no Hearthstone)
    const W = innerWidth, H = innerHeight;
    const ordem = [...PACOTE]; for (let i = ordem.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [ordem[i], ordem[j]] = [ordem[j], ordem[i]]; }
    const cartas = ordem.map((c,i)=>{
      let x, y, r;
      // 8 em cima e 7 embaixo; a ordem foi embaralhada (a rara pode estar em qualquer lugar, como num pacote de verdade)
      if (i < 8){ const k = i - 3.5; x = W/2 + k * Math.min(128, W/9); y = H*.24 + Math.abs(k)*4; r = k*1.5; }
      else { const k = i - 8 - 3; x = W/2 + k * Math.min(132, W/8.5); y = H*.64 + Math.abs(k)*8; r = k*3; }
      return `<div class="carta ${c.faixa}${c.nova?' ehNova':''}" style="--d:${i*.05}s;--r:${r}deg" data-x="${x}" data-y="${y}">
        <div class="raios"></div><div class="aura"></div><div class="estouro"></div><div class="luz"></div>
        <div class="gira"><div class="lado costas"></div><div class="lado frente" style="background-image:url('${img(c)}')"></div></div>
        <span class="selo">${NOMES[c.faixa]}</span>${c.nova?'<span class="nova">Novo</span>':''}</div>`;
    }).join('');
    palco.insertAdjacentHTML('beforeend', cartas);
    const els = [...palco.querySelectorAll('.carta')];
    requestAnimationFrame(()=>requestAnimationFrame(()=>els.forEach(el=>{ el.style.left = el.dataset.x + 'px'; el.style.top = el.dataset.y + 'px'; el.classList.add('posta'); })));
    els.forEach(el=>el.onclick = ()=>{
      if (el.classList.contains('virada')){   // já virada: abre o zoom para ler
        const z = document.createElement('div'); z.id = 'zoom'; z.style.setProperty('--cor', getComputedStyle(el).getPropertyValue('--cor'));
        z.innerHTML = `<img src="${el.querySelector('.frente').style.backgroundImage.slice(5,-2)}">`; z.onclick = ()=>z.remove(); document.body.appendChild(z); return; }
      const nivel = ordem[els.indexOf(el)].faixa;
      if (el.classList.contains('carrega')) return;   // ainda juntando luz
      if (nivel !== 'comum' && nivel !== 'incomum' && !el.classList.contains('revela')){   // rara/mítica/especial: suspense antes de virar
        el.classList.add('carrega'); setTimeout(()=>{ el.classList.remove('carrega'); el.classList.add('revela'); el.click(); }, 620); return; }
      if (el.classList.contains('virada')) return;
      el.classList.add('virada'); brilhoSom(nivel);
      if (nivel === 'mitica'){ bum(.85, .8); palco.classList.remove('treme'); void palco.offsetWidth; palco.classList.add('treme'); }
      else if (nivel === 'rara' || nivel === 'especial') bum(1.4, .35);
      if (nivel !== 'comum'){ const r = el.getBoundingClientRect(); const n = nivel === 'mitica' ? 40 : 18;
        for (let i=0;i<n;i++){ const f = document.createElement('div'); f.className = 'faisca'; f.style.setProperty('--cor', getComputedStyle(el).getPropertyValue('--cor'));
          f.style.left = (r.left + r.width/2) + 'px'; f.style.top = (r.top + r.height/2) + 'px'; const g = Math.random()*Math.PI*2, d = 60 + Math.random()*(nivel==='mitica'?260:140);
          f.style.setProperty('--x', Math.cos(g)*d + 'px'); f.style.setProperty('--y', Math.sin(g)*d + 'px'); palco.appendChild(f); setTimeout(()=>f.remove(), 1000); } }
      if (!palco.querySelector('.carta:not(.virada)')) document.getElementById('pronto').style.display = 'block';
    });
    document.getElementById('pronto').onclick = ()=>parent.postMessage({booster:'pronto'}, '*');
  }, 520);
}
window.addEventListener('message', e=>{
  if (!e.data || !e.data.cartas) return;
  PACOTE = e.data.cartas; MUNDO = (e.data.mundo || 'MUNDO 1').toUpperCase(); NOME_MUNDO = (e.data.nomeMundo || '').toUpperCase();
  if (e.data.arte) document.documentElement.style.setProperty('--arte', `url('${e.data.arte}')`);
  if (e.data.foco) document.documentElement.style.setProperty('--foco', e.data.foco);
  PACOTE.forEach(c=>{ const i = new Image(); i.src = c.img; });   // já baixa as imagens
  montar();
});
parent.postMessage({booster:'pronta'}, '*');
</script>
