<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia: Deck do dia</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff-titulo:'Cinzel',serif;--azul:#6fb8e0}
body{margin:0;height:100vh;overflow:hidden;background:#1a1410 url('https://api.scryfall.com/cards/named?exact=Baba%20Lysaga%2C%20Night%20Witch&format=image&version=art_crop') center/cover;font-family:'EB Garamond',serif;color:#eee}
#ctrl{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:8px}
#ctrl button{font-family:var(--ff-titulo);background:#2a5f84;border:1px solid var(--azul);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
#ctrl button:hover{filter:brightness(1.15)}

#dd{position:fixed;inset:0;z-index:10;pointer-events:none;perspective:1400px;display:none}
#dd.on{display:block}
#dd .fundo{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0b1a26ee 0%,#03070bf8 70%);opacity:0;animation:ddEscurece .6s forwards}
#dd.sai .fundo{animation:ddClareia .7s .45s forwards}
@keyframes ddEscurece{to{opacity:1}}
@keyframes ddClareia{from{opacity:1}to{opacity:0}}

/* a carta: desce flutuando virada, gira e revela */
#dd .palco{position:absolute;left:50%;top:46%;width:min(26vw,300px);aspect-ratio:63/88;transform:translate(-50%,-50%)}
#dd .palco{opacity:0;animation:ddAparece .5s .3s forwards}
@keyframes ddAparece{to{opacity:1}}
#dd .carta{position:absolute;inset:0;transform-style:preserve-3d;transform:translateY(-70vh) rotateY(0) rotateZ(-8deg);
  animation:ddDesce 1.1s cubic-bezier(.2,.9,.3,1) .3s forwards, ddVira .9s cubic-bezier(.5,0,.2,1) 1.6s forwards}
#dd .flutua{position:absolute;inset:0;transform-style:preserve-3d;animation:ddFlutua 3.4s ease-in-out 2.5s infinite}
@keyframes ddDesce{to{transform:translateY(0) rotateY(0) rotateZ(0)}}
@keyframes ddVira{from{transform:translateY(0) rotateY(0)}to{transform:translateY(0) rotateY(180deg) scale(1.06)}}
@keyframes ddFlutua{0%,100%{transform:translateY(0) rotateX(3deg)}50%{transform:translateY(-12px) rotateX(-3deg)}}
#dd .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;border-radius:4.5%/3.3%;backface-visibility:hidden;background:#000 center/cover;box-shadow:0 0 0 2px #9fd8ff55,0 20px 50px #000c}
#dd .verso{background-image:url('https://backs.scryfall.io/large/0/a/0aeebaf5-8c7d-4636-9e82-8c27447861f7.jpg');animation:ddAura 2s ease-in-out .3s infinite}
#dd .frente{transform:rotateY(180deg);background-image:url('https://api.scryfall.com/cards/named?exact=Baba%20Lysaga%2C%20Night%20Witch&format=image&version=large');animation:ddAura 2.4s ease-in-out 2.5s infinite}
@keyframes ddAura{50%{box-shadow:0 0 0 2px #cdeeff,0 0 34px 8px #4fb0f0cc,0 0 90px 26px #2a7ac066}}
/* reflexo depois de revelada */
#dd .frente::after{content:'';position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(115deg,transparent 40%,#ffffff66 50%,transparent 60%) no-repeat;background-size:300% 100%;background-position:120% 0;animation:ddReflexo 1.2s 2.5s ease-out forwards}
@keyframes ddReflexo{to{background-position:-20% 0}}

/* clarão no momento da virada */
#dd .clarao{position:absolute;left:50%;top:46%;width:60vmin;height:60vmin;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,#d8f2ffcc 0%,#6fc0f055 35%,transparent 70%);opacity:0;animation:ddClarao 1s ease-out 2.05s forwards}
@keyframes ddClarao{30%{opacity:1}to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
/* faíscas azuis */
#dd .faisca{position:absolute;left:50%;top:46%;width:5px;height:5px;border-radius:50%;background:#bfe8ff;box-shadow:0 0 8px #6fc0f0;opacity:0;animation:ddFaisca 1.4s ease-out forwards}
@keyframes ddFaisca{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}

#dd .texto{position:absolute;left:0;right:0;top:calc(46% + min(19vw,220px));text-align:center;opacity:0;animation:ddTexto .6s ease-out 2.4s forwards}
#dd .texto small{display:block;font-family:var(--ff-titulo);font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:#8fc8e8}
#dd .texto b{display:block;font-family:var(--ff-titulo);font-weight:800;font-size:clamp(18px,2vw,28px);color:#eef6fb;text-shadow:0 2px 12px #000,0 0 20px #2a7ac0;margin-top:4px}
#dd .texto span{display:inline-block;margin-top:10px;font-size:13px;color:#9fb8c8}
#dd .texto span i{display:inline-block;width:5px;height:5px;margin-left:3px;border-radius:50%;background:#9fb8c8;animation:ddPonto 1.2s infinite}
#dd .texto span i:nth-child(2){animation-delay:.2s}#dd .texto span i:nth-child(3){animation-delay:.4s}
@keyframes ddPonto{50%{opacity:.2}}
@keyframes ddTexto{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* saída: a carta desce e encolhe até a zona de comando */
#dd.sai .palco{transition:transform .8s cubic-bezier(.6,0,.4,1),opacity .8s;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.28);opacity:.0}
#dd.sai .texto{animation:none;opacity:0;transition:opacity .3s}
</style></head><body>
<div id="ctrl"><button id="tocar">Jogar com ele</button><button id="pronto">Simular "partida carregou"</button></div>
<div id="dd"></div>
<script>
// som suave de carta virando: um "whoosh" de ruído e um brilho agudo (gerado aqui, sem arquivo)
function somVirar(vol=.35){
  const a = new (window.AudioContext||window.webkitAudioContext)(), t = a.currentTime;
  const n = a.createBuffer(1, a.sampleRate*.5, a.sampleRate), d = n.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2);
  const s = a.createBufferSource(); s.buffer = n;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(3200, t+.35);
  const g = a.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.08); g.gain.exponentialRampToValueAtTime(.001, t+.5);
  s.connect(f).connect(g).connect(a.destination); s.start(t);
  [1318, 1760, 2637].forEach((hz,k)=>{ const o = a.createOscillator(), og = a.createGain(); o.type = 'sine'; o.frequency.value = hz;
    og.gain.setValueAtTime(0, t+.25+k*.06); og.gain.linearRampToValueAtTime(vol*.25, t+.28+k*.06); og.gain.exponentialRampToValueAtTime(.001, t+1.4+k*.06);
    o.connect(og).connect(a.destination); o.start(t+.25+k*.06); o.stop(t+1.6); });
}
let inicio = 0, saidaPedida = false;
function tocar(){
  const dd = document.getElementById('dd');
  dd.className = ''; void dd.offsetWidth;
  dd.innerHTML = `<div class="fundo"></div><div class="clarao"></div>
    <div class="palco"><div class="carta"><div class="flutua"><div class="face verso"></div><div class="face frente"></div></div></div></div>
    <div class="texto"><small>Seu deck de hoje</small><b>Baba Lysaga, Night Witch</b><span>Preparando a mesa<i></i><i></i><i></i></span></div>`;
  dd.classList.add('on'); inicio = Date.now(); saidaPedida = false;
  setTimeout(()=>somVirar(), 1650);
  setTimeout(()=>{ for (let i=0;i<22;i++){ const f = document.createElement('div'); f.className = 'faisca';
      const ang = Math.random()*Math.PI*2, r = 120 + Math.random()*220;
      f.style.setProperty('--x', Math.cos(ang)*r+'px'); f.style.setProperty('--y', Math.sin(ang)*r+'px'); f.style.animationDelay = (Math.random()*.15)+'s';
      dd.appendChild(f); } }, 2050);
}
// a partida carregou: espera a revelação terminar (mínimo ~4,2 s) e a carta desce para a zona de comando
function sair(){
  const dd = document.getElementById('dd'); if (!dd.classList.contains('on') || saidaPedida) return; saidaPedida = true;
  const falta = Math.max(0, 4200 - (Date.now() - inicio));
  setTimeout(()=>{
    const p = dd.querySelector('.palco');
    p.style.setProperty('--dx', '-38vw'); p.style.setProperty('--dy', '40vh');   // canto da sua zona de comando
    dd.classList.add('sai');
    setTimeout(()=>{ dd.className = ''; dd.innerHTML = ''; }, 1300);
  }, falta);
}
document.getElementById('tocar').onclick = tocar;
document.getElementById('pronto').onclick = sair;
</script>
</body></html>
