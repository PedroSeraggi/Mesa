<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Campanha</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Metamorphous&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ff:'Metamorphous',serif;--fc:'EB Garamond',serif;--ouro:#E4C874;--ouro2:#c9a24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#070504;color:#eee;font-family:var(--fc)}
/* fundo: arte do comandante selecionado, mexendo devagar (parallax) */
#fundo{position:fixed;inset:-6%;display:flex;transition:opacity .6s;will-change:transform}
#fundo{inset:-3%}
#fundo .borrado{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(28px) brightness(.45) saturate(1.2)}
#fundo .nitida{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(1050px,64vw);aspect-ratio:626/457;display:flex;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 100%)}
#fundo .nitida div{flex:1;background:center/cover no-repeat;animation:respiraFundo 18s ease-in-out infinite alternate}
#fundo.tres .nitida{width:min(1250px,76vw);aspect-ratio:2/1}
@keyframes respiraFundo{from{transform:scale(1)}to{transform:scale(1.03)}}
#fundo.troca{opacity:0}
#sombra{position:fixed;inset:0;pointer-events:none;background:
  linear-gradient(90deg,#070504f0 0%,#070504c0 26%,transparent 45%,transparent 62%,#070504b0 80%),
  linear-gradient(0deg,#070504 0%,#070504cc 18%,transparent 45%),
  linear-gradient(180deg,#070504aa,transparent 16%)}
#brasas{position:fixed;inset:0;pointer-events:none}
/* topo */
.topo{position:fixed;top:0;left:0;right:0;height:72px;display:flex;align-items:center;padding:0 28px;gap:22px;z-index:3}
.topo h1{margin:0;font-family:var(--ff);font-weight:900;font-size:26px;letter-spacing:.16em;color:var(--ouro);text-shadow:0 0 18px #c9a24a66}
.topo h1 small{display:block;font-size:11px;letter-spacing:.32em;color:#a8957d;font-weight:600}
.topo .esp{flex:1}
.ouro{display:flex;align-items:center;gap:7px;font-family:var(--ff);font-weight:700;color:#ffe08a;background:#0009;border:1px solid #c9a24a66;border-radius:999px;padding:5px 14px 5px 7px}
.ouro svg{width:22px;height:22px}
.jog{display:flex;align-items:center;gap:9px;font-family:var(--ff);font-size:14px;color:#eee;background:#0009;border:1px solid #ffffff22;border-radius:999px;padding:4px 14px 4px 4px}
.jog i{width:28px;height:28px;border-radius:50%;background:#3a2a14;color:var(--ouro);display:grid;place-items:center;font-style:normal;font-weight:800}
.voltar{font-family:var(--ff);background:#0009;border:1px solid #c9a24a66;color:var(--ouro);padding:7px 14px;border-radius:9px;cursor:pointer;letter-spacing:.08em}
/* lista de batalhas */
#lista{position:fixed;left:24px;top:84px;bottom:86px;width:360px;overflow-y:auto;padding:6px 10px 6px 4px;z-index:2;scrollbar-width:thin;scrollbar-color:#c9a24a55 transparent}
.bat{position:relative;display:flex;align-items:center;gap:12px;margin:0 0 8px;padding:7px;border-radius:11px;cursor:pointer;
  background:linear-gradient(90deg,#1e1610ee,#140e09dd);border:1px solid #4a3a2899;transition:transform .25s,box-shadow .25s,border-color .25s,margin .25s}
.bat:hover{border-color:#c9a24aaa;transform:translateX(4px)}
.bat .mini{width:62px;height:46px;border-radius:7px;background:#000 center/cover;flex:none;box-shadow:0 0 0 1px #0008}
.bat .num{position:absolute;left:-2px;top:-6px;font-family:var(--ff);font-size:10px;font-weight:800;color:#140e09;background:var(--ouro2);border-radius:6px;padding:1px 5px}
.bat .tx{min-width:0;flex:1}
.bat b{display:block;font-family:var(--ff);font-size:14px;letter-spacing:.04em;color:#f0e6d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bat small{display:block;font-size:13px;color:#a8957d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bat .est{flex:none;font-size:16px;width:22px;text-align:center}
.bat.feita .est{color:#7ad08a}
.bat.feita .mini{filter:saturate(.7)}
/* chefões (3 bots) */
.bat.tres{border-color:#8a3a2a99;background:linear-gradient(90deg,#2a1210ee,#160a08dd)}
.bat.tres .mini{background-size:cover;display:flex;overflow:hidden}
.bat.tres .mini span{flex:1;background:center/cover}
.bat.tres .num{background:#d0603a;color:#fff}
/* próximo mundo (ainda não lançado) */
.bat.proxMundo{cursor:default;margin-top:14px;border-color:#8a4ab066;background:linear-gradient(90deg,#2a0e3aee,#120618dd);box-shadow:0 0 18px #8a4ab022}
.bat.proxMundo .mini{background:radial-gradient(circle at 50% 50%,#c890ff 0%,#6a2a9a 30%,#1a0626 70%);box-shadow:0 0 12px #a060e066}
.bat.proxMundo b{color:#e0c8ff}.bat.proxMundo small{color:#b090d0}.bat.proxMundo .est{color:#b090d0}
.bat.proxMundo:hover{transform:none}
/* chefe do mundo */
.bat.chefe{padding:10px;border-color:#ff7a3a;background:linear-gradient(90deg,#3a120aee,#1a0806dd);box-shadow:0 0 0 1px #ff7a3a88,0 0 22px #ff5a2a44}
.bat.chefe .mini{width:84px;height:62px}
.bat.chefe b{color:#ffb070}
.bat.chefe .num{background:linear-gradient(180deg,#ffd060,#d07a1a);color:#2a0a04}
.bat.chefe .coroa{position:absolute;right:30px;top:-10px;line-height:0;filter:drop-shadow(0 0 6px #ff8a3a)}
.bat.chefe.bloq{filter:brightness(.55) saturate(.6)}
#painel.chefe{border-color:#ff7a3a;box-shadow:0 0 40px #ff5a2a33,0 20px 50px #000c}
#painel.chefe .cap{color:#ff9a5a}
/* a atual: maior e brilhando */
.bat.atual{padding:10px;margin:10px 0 14px;border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro),0 0 26px #f0c44a55;animation:pulsoAtual 2.4s ease-in-out infinite}
.bat.atual .mini{width:84px;height:62px}
.bat.atual b{font-size:16px}
@keyframes pulsoAtual{50%{box-shadow:0 0 0 1px var(--ouro),0 0 40px #f0c44a99}}
/* bloqueadas: escuras */
.bat.bloq{cursor:default;filter:brightness(.42) saturate(.3)}
.bat.bloq:hover{transform:none;border-color:#4a3a2899}
/* selecionada (a que está no fundo) */
.bat.sel:not(.atual){border-color:#E4C874cc;box-shadow:0 0 0 1px #E4C87488}
/* painel da direita: lore e começar */
#painel{position:fixed;right:32px;top:50%;transform:translateY(-50%);width:min(400px,32vw);z-index:2;padding:24px 26px;border-radius:16px;
  background:linear-gradient(180deg,#140e09e8,#0a0705f0);border:1px solid #c9a24a66;box-shadow:0 20px 50px #000c,inset 0 1px 0 #ffffff10;backdrop-filter:blur(3px)}
#painel .cap{font-family:var(--ff);font-size:12px;letter-spacing:.3em;color:var(--ouro2)}
#painel h2{margin:4px 0 2px;font-family:var(--ff);font-weight:800;font-size:24px;color:#fff;letter-spacing:.04em}
#painel .cmds{font-size:15px;color:#d9c8b0;font-style:italic}
#painel .lore{margin:16px 0 0;font-size:17px;line-height:1.5;color:#efe4cc;max-height:34vh;overflow-y:auto}
#painel .lore::first-letter{font-family:var(--ff);font-size:30px;line-height:1;color:var(--ouro)}
#painel .premio{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0;font-size:14px;color:#d9c8b0}
#painel .premio span{display:flex;align-items:center;gap:5px;background:#0006;border:1px solid #ffffff18;border-radius:8px;padding:4px 9px}
#painel .premio svg{width:16px;height:16px}
#comecar{display:block;width:100%;margin-top:20px;padding:16px;font-family:var(--ff);font-weight:900;font-size:22px;letter-spacing:.2em;color:#1a1006;cursor:pointer;
  border:0;border-radius:12px;background:linear-gradient(180deg,#ffe08a,#e0a83a 55%,#b8802a);box-shadow:0 6px 0 #6a4a14,0 10px 30px #f0c44a55;transition:transform .15s,filter .2s}
#comecar:hover{filter:brightness(1.1);transform:translateY(-2px)}
#comecar:active{transform:translateY(3px);box-shadow:0 2px 0 #6a4a14}
#comecar.de-novo{background:linear-gradient(180deg,#e8dcc4,#b8a888);box-shadow:0 6px 0 #5a4a34}
/* título grande embaixo, sobre a arte */
#nomeGrande{position:fixed;left:410px;bottom:34px;z-index:2;pointer-events:none}
#nomeGrande b{display:block;font-family:var(--ff);font-weight:900;font-size:clamp(28px,3.4vw,52px);line-height:1.02;color:#fff;text-shadow:0 4px 30px #000}
#nomeGrande small{font-family:var(--ff);font-size:14px;letter-spacing:.24em;color:var(--ouro)}
.editar{position:fixed;left:28px;bottom:26px;z-index:3;font-family:var(--ff);font-weight:700;letter-spacing:.14em;font-size:15px;background:#140e09e8;border:1px solid var(--ouro2);color:var(--ouro);padding:12px 30px;border-radius:12px;cursor:pointer}
.editar.bazar{left:220px}
.editar:hover{background:#2a1e10;box-shadow:0 0 20px #c9a24a44}
@media (max-width:1100px){#nomeGrande{display:none}#lista{width:300px}}
</style></head><body>
<div id="fundo"></div><div id="sombra"></div><canvas id="brasas"></canvas>
<div class="topo">
  <button class="voltar">← Menu</button>
  <h1><small>MUNDO 1</small>TERRAS DE ORIGEM</h1>
  <div class="esp"></div>
  <div class="ouro"><svg viewBox="0 0 24 24"><defs><radialGradient id="mg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".45" stop-color="#f0c44a"/><stop offset="1" stop-color="#9a6a18"/></radialGradient></defs><circle cx="12" cy="12" r="10.5" fill="url(#mg)" stroke="#7a5414" stroke-width="1.2"/><path d="M8 16V8.4l4 4.6 4-4.6V16" fill="none" stroke="#7a5414" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="vOuro">0</span></div>
  <div class="jog"><i id="vIni">?</i><span id="vNome"></span></div>
</div>
<div id="lista"></div>
<div id="nomeGrande"></div>
<div id="painel"></div>
<button class="editar">EDITAR DECK</button><button class="editar bazar">O BAZAR</button>
<script>
const artSf = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=art_crop`;
const artHd = n => `campanha/artes/${encodeURIComponent(n.split(',')[0].toLowerCase().replace(/[^a-z0-9]+/g,'-'))}.jpg`;
const art = artSf;
const artFundo = n => artHd(n) + `'), url('${artSf(n)}`;
const BAT = [
 {n:1, d:[['Soldados de Akros','Kytheon, Hero of Akros']], lore:'Sua jornada começa nos portões de Akros. O jovem Kytheon não deixa nenhum estranho passar sem provar seu valor, e os soldados dele lutam ombro a ombro. Vença e as estradas se abrem para você.'},
 {n:2, d:[['Horda de Zumbis','Liliana, Heretical Healer']], lore:'Na estrada para o leste, os mortos não ficam no chão. Uma curandeira chamada Liliana tentou salvar o irmão e acabou descobrindo outro dom. Agora a horda dela anda pelos campos à noite.'},
 {n:3, d:[['Bando Goblin','Pia and Kiran Nalaar']], lore:'Em Ghirapur, os inventores Pia e Kiran soltaram suas máquinas, e um bando de goblins veio junto atrás de confusão. Eles querem ver do que o seu deck é feito, de preferência pegando fogo.'},
 {n:4, d:[['Elfos da Floresta','Dwynen, Gilt-Leaf Daen']], lore:'A floresta de Lorwyn não gosta de visitantes. Dwynen comanda os elfos Gilt-Leaf e acredita que só os belos merecem passar. Você vai ter que convencê-la com força, não com palavras.'},
 {n:5, d:[['Maré dos Merfolk','Jalira, Master Polymorphist'],['Feras Selvagens','Yisan, the Wanderer Bard'],['Guerreiros Ancestrais','Kurkesh, Onakke Ancient']], lore:'Três líderes ouviram falar de você e não gostaram. Jalira transforma tudo o que toca, Yisan chama as feras com o seu canto e Kurkesh guarda o poder dos antigos. Eles vêm juntos.'},
 {n:6, d:[['Corte dos Vampiros','Kothophed, Soul Hoarder']], lore:'O castelo de Kothophed coleciona almas como quem coleciona moedas. A corte dele é educada, elegante e está com muita sede. Não aceite o convite para jantar.'},
 {n:7, d:[['Círculo dos Magos','Talrand, Sky Summoner']], lore:'Talrand lê o céu e cada feitiço que lança vira um dragão de vento. O círculo de magos dele estuda há séculos. Você estudou o seu deck?'},
 {n:8, d:[['Fúria Elemental','Nissa, Vastwood Seer']], lore:'A terra acordou. Nissa ouve a voz de Zendikar e os elementais respondem ao chamado dela. Cada terreno que ela toca ganha vida para te esmagar.'},
 {n:9, d:[['Oficina dos Golens','Alhammarret, High Arbiter']], lore:'Em Ghirapur, o grande árbitro Alhammarret decide quem pode lutar e o que pode ser usado. As máquinas dele não se cansam e não perdoam erros.'},
 {n:10, d:[['Ordem dos Cavaleiros','Hixus, Prison Warden'],['Véu das Ilusões',"Jace, Vryn's Prodigy"],['Enxame de Insetos',"Yeva, Nature's Herald"]], lore:'O carcereiro Hixus quer te prender, o jovem Jace quer entrar na sua mente e Yeva solta o enxame da floresta. Metade do mundo já ouviu o seu nome. Esta é a prova do meio do caminho.'},
 {n:11, d:[['Colmeia dos Slivers','Sliver Hivelord']], lore:'Nas cavernas, algo se mexe como um só corpo. Cada Sliver que nasce deixa todos os outros mais fortes. O Hivelord é o coração da colmeia, e ela não para de crescer.'},
 {n:12, d:[['Pacto de Sangue','Ob Nixilis, Unshackled']], lore:'Ob Nixilis quebrou as próprias correntes e agora cobra um preço de quem cruza o caminho dele. Toda carta que você busca vai custar caro. Lembre-se: ele também paga.'},
 {n:13, d:[['Ninho dos Dragões','Chandra, Fire of Kaladesh']], lore:'Uma garota em Kaladesh não consegue controlar o próprio fogo. Os dragões sentiram e vieram até ela. Chandra não quer te machucar, mas o fogo não pergunta.'},
 {n:14, d:[['Coro dos Anjos','Avacyn, Guardian Angel']], lore:'Os sinos de Innistrad tocam e Avacyn desce com o seu coro. O anjo guardião protege tudo o que é dela, e agora você está no território dela.'},
 {n:15, chefe:true, d:[['Exército de Krenko','Krenko, Mob Boss']], lore:'No fim das Terras de Origem, uma risada ecoa pelos becos. Krenko não é o mais forte, nem o mais esperto, mas nunca está sozinho: a cada turno, mais goblins saem das sombras. Se você não derrubá-lo rápido, a horda vai cobrir o mundo. Vença e o próximo mundo se abre.'},
];
let ATUAL = 1, sel = 1;
const MOEDA = document.querySelector('.ouro svg').outerHTML;
const CAD = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" fill-opacity=".25"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function desenharLista(){
  document.getElementById('lista').innerHTML = BAT.map(b=>{
    const tres = b.d.length > 1, st = b.n < ATUAL ? 'feita' : b.n === ATUAL ? 'atual' : 'bloq';
    const mini = tres ? `<div class="mini">${b.d.map(x=>`<span style="background-image:url('${art(x[1])}')"></span>`).join('')}</div>` : `<div class="mini" style="background-image:url('${art(b.d[0][1])}')"></div>`;
    const nome = tres ? 'Batalha dos três' : b.chefe ? 'Chefe: Krenko' : b.d[0][0];
    const cmd = tres ? b.d.map(x=>x[1].split(',')[0]).join(' · ') : b.d[0][1];
    return `<div class="bat ${st}${tres?' tres':''}${b.chefe?' chefe':''}${b.n===sel?' sel':''}" data-n="${b.n}"><span class="num">${b.n}</span>${b.chefe?'<span class="coroa"><svg viewBox="0 0 32 22" width="26" height="18"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#f0b040"/><stop offset="1" stop-color="#9a5a10"/></linearGradient></defs><path d="M2 19 L4 6 L11 12 L16 2 L21 12 L28 6 L30 19 Z" fill="url(#cg)" stroke="#5a3008" stroke-width="1.2" stroke-linejoin="round"/><circle cx="16" cy="13" r="2.2" fill="#ff5a3a" stroke="#5a1a08" stroke-width=".8"/></svg></span>':''}${mini}<div class="tx"><b>${nome}</b><small>${cmd}</small></div><span class="est">${st==='feita'?'✓':st==='bloq'?'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor" fill-opacity=".25"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>':''}</span></div>`;
  }).join('') + `<div class="bat proxMundo"><div class="mini"></div><div class="tx"><b>Mundo 2 · O Abismo</b><small>${ATUAL > 15 ? 'O portal se abriu. Em breve.' : 'Derrote o Krenko para abrir o portal'}</small></div><span class="est">${CAD}</span></div>`;
  document.querySelectorAll('.bat:not(.proxMundo)').forEach(e=>e.onclick=()=>{ const n=+e.dataset.n; if (n>ATUAL || n===sel) return; sel=n; mostrar(); desenharLista(); });
}
function mostrar(){
  const b = BAT[sel-1], tres = b.d.length > 1, f = document.getElementById('fundo');
  f.classList.add('troca');
  setTimeout(()=>{ f.className = tres ? 'tres' : ''; f.innerHTML = `<div class="borrado" style="background-image:url('${art(b.d[0][1])}')"></div><div class="nitida">${b.d.map(x=>`<div style="background-image:url('${artFundo(x[1])}')"></div>`).join('')}</div>`; f.classList.remove('troca'); }, 350);
  document.getElementById('nomeGrande').innerHTML = `<small>${b.chefe ? 'CHEFE DO MUNDO' : `BATALHA ${b.n}${tres?' · TRÊS OPONENTES':''}`}</small><b>${tres?'Batalha dos três':b.d[0][1].split(',')[0]}</b>`;
  const ganho = tres || b.chefe ? 500 : 250, feita = b.n < ATUAL;
  document.getElementById('painel').classList.toggle('chefe', !!b.chefe);
  document.getElementById('painel').innerHTML = `<div class="cap">${b.chefe ? 'CHEFE DO MUNDO · BATALHA 15' : `BATALHA ${b.n} DE 15`}</div><h2>${tres?'Batalha dos três':b.d[0][0]}</h2>
    <div class="cmds">${b.d.map(x=>x[1]).join(' · ')}</div>
    <p class="lore">${b.lore}</p>
    <div class="premio"><span>${MOEDA} ${ganho} na vitória</span>${feita?'<span>✓ Já vencida</span>':'<span>+1 booster na primeira vitória</span>'}</div>
    <button id="comecar" class="${feita?'de-novo':''}">${feita?'JOGAR DE NOVO':'COMEÇAR'}</button>`;
}
const pai = m => parent.postMessage(Object.assign({campanha: true}, m), '*');
document.querySelector('.voltar').onclick = () => pai({acao: 'fechar'});
document.querySelector('.editar').onclick = () => pai({acao: 'editar'});
document.querySelector('.editar.bazar').onclick = () => pai({acao: 'bazar'});
document.getElementById('painel').addEventListener('click', e => { if (e.target.id === 'comecar') pai({acao: 'jogar', batalha: sel, oponentes: BAT[sel-1].d}); });
// o Mesa manda o estado: {batalha, ouro, nome}
addEventListener('message', e => { const d = e.data; if (!d || d.estado === undefined) return;
  ATUAL = d.estado.batalha || 1; sel = Math.min(15, ATUAL);   // 16 = Mundo 1 concluído
  document.getElementById('vOuro').textContent = Number(d.ouro || 0).toLocaleString('pt-BR');
  document.getElementById('vNome').textContent = d.nome || ''; document.getElementById('vIni').textContent = (d.nome || '?')[0].toUpperCase();
  desenharLista(); mostrar(); setTimeout(() => document.querySelector('.bat.atual')?.scrollIntoView({block: 'center'}), 50); });
pai({acao: 'pronta'});
// parallax: o fundo acompanha o mouse devagar
let mx=0,my=0,px=0,py=0; addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const fundo=document.getElementById('fundo');
// brasas subindo
const cv=document.getElementById('brasas'),g=cv.getContext('2d'); let B=[];
function tam(){cv.width=innerWidth;cv.height=innerHeight} tam(); addEventListener('resize',tam);
for(let i=0;i<70;i++)B.push(nova(true));
function nova(qq){return{x:Math.random()*innerWidth,y:qq?Math.random()*innerHeight:innerHeight+10,v:.4+Math.random()*1.1,r:.8+Math.random()*2.2,o:Math.random()*Math.PI*2,a:.4+Math.random()*.6}}
(function loop(){
  px+=(mx-px)*.04; py+=(my-py)*.04; fundo.style.transform=`translate(${-px*18}px,${-py*12}px)`;
  g.clearRect(0,0,cv.width,cv.height);
  for(const b of B){ b.y-=b.v; b.o+=.02; b.x+=Math.sin(b.o)*.5; if(b.y<-10)Object.assign(b,nova(false));
    const al=b.a*Math.min(1,(b.y/innerHeight)*1.6); g.beginPath(); g.fillStyle=`rgba(255,${140+Math.floor(b.r*30)},60,${al})`; g.shadowColor='#ff8a2a'; g.shadowBlur=8; g.arc(b.x,b.y,b.r,0,7); g.fill(); }
  requestAnimationFrame(loop);
})();
</script>
</body></html>
