<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia: deckboxes 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif;--ouro:#E4C874}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a1d12 0%,#120c08 70%);font-family:'EB Garamond',serif;color:#eee;padding:30px 24px 60px}
h2{font-family:var(--ff);color:var(--ouro);margin:0 0 10px;letter-spacing:.06em}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 20px}

/* ---------- commander box 3D: caixa fechada, tampa, janela com o comandante ---------- */
.cena{--L:150px;--A:180px;--P:96px;height:370px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;perspective:1100px;cursor:pointer}
.caixa{position:relative;width:var(--L);height:var(--A);transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-28deg);transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.cena:hover .caixa{transform:rotateX(-20deg) rotateY(-14deg) translateY(-6px)}
.face{position:absolute;left:0;top:0;backface-visibility:hidden}
/* couro sintético com costura */
.couro{background:
   radial-gradient(ellipse at 25% 5%,#ffffff22,transparent 55%),
   repeating-linear-gradient(45deg,#0000 0 2px,#ffffff07 2px 3px),
   repeating-linear-gradient(-45deg,#0000 0 2px,#00000010 2px 3px),
   linear-gradient(170deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 1px #0006}
.costura::after{content:'';position:absolute;inset:7px;border:1.5px dashed #ffffff40;border-radius:4px;pointer-events:none}
.frente{width:var(--L);height:var(--A);transform:translateZ(calc(var(--P)/2))}
.tras{width:var(--L);height:var(--A);transform:rotateY(180deg) translateZ(calc(var(--P)/2))}
.dir{width:var(--P);height:var(--A);left:calc((var(--L) - var(--P))/2);transform:rotateY(90deg) translateZ(calc(var(--L)/2));filter:brightness(.6)}
.esq{width:var(--P);height:var(--A);left:calc((var(--L) - var(--P))/2);transform:rotateY(-90deg) translateZ(calc(var(--L)/2));filter:brightness(.85)}
.fundo{width:var(--L);height:var(--P);transform:translateY(calc(var(--A) - var(--P)/2)) rotateX(-90deg);filter:brightness(.35)}
/* interior (aparece quando a tampa abre) */
.dentro{width:calc(var(--L) - 6px);height:calc(var(--P) - 6px);left:3px;top:3px;transform-origin:50% 0;transform:translateY(8px) translateZ(calc(var(--P)/-2 + 3px)) rotateX(90deg);background:#0a0604;box-shadow:inset 0 0 20px #000}
/* tampa: dobradiça na parte de trás, abre para cima */
.tampa{position:absolute;left:0;top:0;width:var(--L);height:var(--P);transform-style:preserve-3d;transform-origin:50% 0;
  transform:translateZ(calc(var(--P)/-2)) rotateX(90deg);transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.tampa .topo{width:calc(var(--L) + 4px);height:calc(var(--P) + 4px);left:-2px;top:-2px;transform:translateZ(1px);border-radius:4px}
.tampa .aba{width:var(--L);height:26px;top:var(--P);transform-origin:50% 0;transform:rotateX(90deg);filter:brightness(.9)}
.cena:hover .tampa{transform:translateZ(calc(var(--P)/-2)) rotateX(168deg)}
/* símbolo na tampa */
.tampa .topo .selo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:3px;opacity:.85}
.tampa .topo .selo img{width:14px;height:14px;filter:drop-shadow(0 1px 1px #000)}
/* janela transparente com o comandante */
.janela{position:absolute;left:24px;right:24px;top:22px;bottom:44px;border-radius:12px;overflow:hidden;background:#000 center 18%/cover;
  box-shadow:inset 0 0 0 2px #0009,0 0 0 3px #ffffff1a,inset 0 0 14px #000a}
.janela::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,#ffffff38 0%,#ffffff08 30%,transparent 45%,transparent 70%,#ffffff12 85%,transparent);pointer-events:none}
.janelaMoldura{position:absolute;left:19px;right:19px;top:17px;bottom:39px;border-radius:15px;border:1.5px dashed #ffffff40;pointer-events:none}
.gemas{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:4px}
.gemas img{width:17px;height:17px;filter:drop-shadow(0 2px 2px #000)}
.lombada{position:absolute;inset:16px 6px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:var(--ff);font-size:12px;letter-spacing:.16em;color:#ffffffb0;text-shadow:0 1px 2px #0008;white-space:nowrap;overflow:hidden}
/* as 3 criaturas que saem por cima em leque */
.cartasSaem{position:absolute;left:50%;top:0;width:0;height:0;transform:translateZ(0)}
.cs{position:absolute;width:104px;aspect-ratio:63/88;left:-52px;top:-10px;border-radius:6px;background:#000 center/cover;box-shadow:0 8px 18px #000c;
  transform:translateY(40px) scale(.7);opacity:0;transition:transform .55s cubic-bezier(.2,1.3,.4,1),opacity .25s;transition-delay:var(--dl)}
.cena:hover .cs{opacity:1;transform:translate(var(--x),-150px) rotate(var(--r));transition-delay:calc(.15s + var(--dl))}
.cena:hover .cs:nth-child(2){transform:translate(var(--x),-170px) rotate(var(--r))}
.sombra{position:absolute;left:50%;bottom:-26px;width:calc(var(--L) * 1.4);height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#000c,transparent 70%);filter:blur(4px)}
.rotulo{text-align:center;margin-top:-18px}
.rotulo b{display:block;font-family:var(--ff);font-size:13.5px;color:#f3e2c0}
.rotulo small{display:block;font-size:12.5px;color:#a8957d}
.rotulo small.aviso{color:#ff9a7a}
</style></head><body>
<h2>Meus decks</h2>
<div class="grade" id="grade"></div>
<script>
const img = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=normal`;
const art = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=art_crop`;
// na Mesa as 3 criaturas são sorteadas da lista do deck; aqui são exemplos
const DECKS = [
  {nome:'Boros Equipamentos', cmd:"Cloud, Planet's Champion", cores:'RW', cri:['Puresteel Paladin','Sram, Senior Edificer','Stoneforge Mystic']},
  {nome:'Dragões', cmd:'The Ur-Dragon', cores:'WUBRG', cri:['Old Gnawbone','Scion of the Ur-Dragon','Lathliss, Dragon Queen']},
  {nome:'Eldrazi — Titãs', cmd:'Ulalek, Fused Atrocity', cores:'C', cri:['Ulamog, the Ceaseless Hunger','Kozilek, Butcher of Truth','Emrakul, the Promised End']},
  {nome:'Fractius', cmd:'The First Sliver', cores:'WUBRG', cri:['Sliver Hivelord','Galerider Sliver','Crystalline Sliver']},
  {nome:'Golgari Aristocratas', cmd:'Meren of Clan Nel Toth', cores:'BG', cri:['Blood Artist','Zulaport Cutthroat','Grim Haruspex']},
  {nome:'Mono White — Anjos', cmd:'Giada, Font of Hope', cores:'W', cri:['Lyra Dawnbringer','Resplendent Angel','Serra Angel']},
  {nome:'Sapos', cmd:'Clement, the Worrywort', cores:'GU', cri:['Poison Dart Frog','Pond Prophet','Twenty-Toed Toad']},
  {nome:'Vampiros', cmd:'Edgar Markov', cores:'RWB', cri:['Bloodlord of Vaasgoth','Captivating Vampire','Vampire Nocturnus']},
  {nome:'Ephara', cmd:'Ephara, God of the Polis', cores:'WU', cartas:98, cri:['Reflector Mage','Spectral Adversary','Thassa, Deep-Dwelling']}
];
const TONS = {W:['#d6c8a4','#7e6e50'], U:['#3f6c98','#162e4a'], B:['#4a4048','#16121a'], R:['#9a4a34','#46180e'], G:['#4a7a4a','#183a20'], C:['#8a857c','#3a3630']};
function cores(c){
  const cs = [...c].filter(k=>TONS[k]);
  if (cs.length >= 4) return ['#a88a4a','#4a3616'];
  if (!cs.length) return TONS.C;
  return [TONS[cs[0]][0], TONS[cs[cs.length-1]][1]];
}
document.getElementById('grade').innerHTML = DECKS.map(d=>{
  const [c1, c2] = cores(d.cores), n = d.cartas || 100;
  const gemas = [...d.cores].map(x=>`<img src="https://svgs.scryfall.io/card-symbols/${x}.svg" alt="${x}">`).join('');
  const saem = d.cri.map((c,i)=>`<div class="cs" style="background-image:url('${img(c)}');--x:${(i-1)*62}px;--r:${(i-1)*14}deg;--dl:${i*.05}s"></div>`).join('');
  return `<div><div class="cena" style="--c1:${c1};--c2:${c2}">
    <div class="caixa">
      <div class="sombra"></div>
      <div class="face fundo couro"></div>
      <div class="face dentro"></div>
      <div class="cartasSaem">${saem}</div>
      <div class="face tras couro"></div>
      <div class="face esq couro costura"><div class="lombada">${d.nome}</div></div>
      <div class="face dir couro"></div>
      <div class="face frente couro costura"><div class="janela" style="background-image:url('${art(d.cmd)}')"></div><div class="janelaMoldura"></div><div class="gemas">${gemas}</div></div>
      <div class="tampa"><div class="face topo couro costura"><div class="selo">${gemas}</div></div></div>
    </div>
  </div><div class="rotulo"><b>${d.nome}</b><small class="${n !== 100 ? 'aviso' : ''}">${d.cmd} · ${n} cartas</small></div></div>`;
}).join('');
</script>
</body></html>
