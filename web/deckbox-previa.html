<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia: deckboxes 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif;--ouro:#E4C874}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a1d12 0%,#120c08 70%);font-family:'EB Garamond',serif;color:#eee;padding:30px 24px 60px}
h2{font-family:var(--ff);color:var(--ouro);margin:0 0 20px;letter-spacing:.06em}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px 20px}

/* ---------- deckbox 3D ---------- */
/* medidas da caixa: largura L, altura A, profundidade P */
.cena{--L:150px;--A:190px;--P:64px;height:340px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;perspective:1100px;cursor:pointer}
.caixa{position:relative;width:var(--L);height:var(--A);transform-style:preserve-3d;
  transform:rotateX(-14deg) rotateY(-24deg);transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.cena:hover .caixa{transform:rotateX(-18deg) rotateY(-8deg) translateY(-6px)}
.face{position:absolute;left:0;top:0;backface-visibility:hidden}
/* material: couro na cor do deck */
.couro{background:
  radial-gradient(ellipse at 30% 10%,#ffffff1c,transparent 55%),
  repeating-linear-gradient(115deg,#0000 0 3px,#ffffff06 3px 4px),
  linear-gradient(170deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 2px #0007,inset 0 0 0 4px #c9a24a66}
.frente{width:var(--L);height:var(--A);transform:translateZ(calc(var(--P)/2))}
.tras{width:var(--L);height:var(--A);transform:rotateY(180deg) translateZ(calc(var(--P)/2))}
.dir{width:var(--P);height:var(--A);left:calc((var(--L) - var(--P))/2);transform:rotateY(90deg) translateZ(calc(var(--L)/2));filter:brightness(.62)}
.esq{width:var(--P);height:var(--A);left:calc((var(--L) - var(--P))/2);transform:rotateY(-90deg) translateZ(calc(var(--L)/2));filter:brightness(.8)}
.fundo{width:var(--L);height:var(--P);top:calc(var(--A) - var(--P)/2);transform:rotateX(-90deg) translateZ(calc(var(--P)/2 - var(--A)/2 + var(--A)/2));transform:translateY(calc(var(--A)/2 - var(--P)/2)) rotateX(-90deg) translateZ(calc(var(--A)/2));filter:brightness(.4)}
/* interior escuro (visto pela boca aberta) */
.dentro{width:var(--L);height:var(--P);top:calc(var(--P)/-2);transform:rotateX(90deg) translateZ(calc(var(--A)/-2 + 6px));background:#0b0705;box-shadow:inset 0 0 18px #000}
/* bordas da boca: um friso dourado em cima da frente e das laterais */
.frente::before,.tras::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(#f1d98a,#9a7428);border-radius:2px}
.dir::before,.esq::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(#f1d98a,#9a7428)}
/* a pilha de cartas e o comandante, dentro da caixa */
.monte{position:absolute;left:10px;width:calc(var(--L) - 20px);height:calc(var(--A) - 30px);top:22px;transform:translateZ(4px);
  background:repeating-linear-gradient(180deg,#e8dcc4 0 2px,#a89676 2px 3px);border-radius:6px;filter:brightness(.7)}
.cmd{position:absolute;left:8px;width:calc(var(--L) - 16px);aspect-ratio:63/88;top:-46px;border-radius:7px;background:#000 center/cover;
  transform:translateZ(14px);transition:transform .6s cubic-bezier(.2,.9,.3,1.2),box-shadow .6s;box-shadow:0 0 0 1px #0008}
.cena:hover .cmd{transform:translateZ(14px) translateY(-78px) rotateZ(-2deg);box-shadow:0 0 26px var(--brilho),0 10px 20px #000c}
/* frente da caixa: detalhes */
.frente i{position:absolute;width:16px;height:16px;border:2px solid #d9b45a;opacity:.9}
.frente i:nth-of-type(1){left:7px;top:12px;border-right:0;border-bottom:0;border-radius:5px 0 0 0}
.frente i:nth-of-type(2){right:7px;top:12px;border-left:0;border-bottom:0;border-radius:0 5px 0 0}
.frente i:nth-of-type(3){left:7px;bottom:7px;border-right:0;border-top:0;border-radius:0 0 0 5px}
.frente i:nth-of-type(4){right:7px;bottom:7px;border-left:0;border-top:0;border-radius:0 0 5px 0}
.gemas{position:absolute;top:58px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.gemas img{width:18px;height:18px;filter:drop-shadow(0 2px 2px #000)}
.placa{position:absolute;left:12px;right:12px;top:84px;padding:7px 6px;border-radius:5px;text-align:center;
  background:linear-gradient(#2a1d10,#170f08);box-shadow:inset 0 0 0 1px #c9a24a88,0 2px 5px #0009}
.placa b{display:block;font-family:var(--ff);font-size:11.5px;line-height:1.2;color:#f6e7c4;text-shadow:0 1px 3px #000}
.qtd{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-family:var(--ff);font-size:9.5px;letter-spacing:.2em;color:#e8d4a8aa}
.qtd.aviso{color:#ff9a7a}
/* lateral: nome do comandante na vertical, como na lombada */
.lombada{position:absolute;inset:14px 4px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:var(--ff);font-size:10.5px;letter-spacing:.14em;color:#f3dfb0cc;white-space:nowrap;overflow:hidden}
/* sombra no chão */
.sombra{position:absolute;left:50%;bottom:-18px;width:calc(var(--L) * 1.3);height:28px;transform:translateX(-50%) rotateX(90deg);border-radius:50%;background:radial-gradient(#000c,transparent 70%);filter:blur(3px)}
.rotulo{text-align:center;margin-top:-12px;font-size:12.5px;color:#bfa88f}
</style></head><body>
<h2>Meus decks</h2>
<div class="grade" id="grade"></div>
<script>
const img = n => `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(n).replace(/'/g,'%27')}&format=image&version=normal`;
const DECKS = [
  {nome:'Boros Equipamentos', cmd:"Cloud, Planet's Champion", cores:'RW'},
  {nome:'Dragões', cmd:'The Ur-Dragon', cores:'WUBRG'},
  {nome:'Eldrazi — Titãs', cmd:'Ulalek, Fused Atrocity', cores:'C'},
  {nome:'Fractius', cmd:'The First Sliver', cores:'WUBRG'},
  {nome:'Golgari Aristocratas', cmd:'Meren of Clan Nel Toth', cores:'BG'},
  {nome:'Mono White — Anjos', cmd:'Giada, Font of Hope', cores:'W'},
  {nome:'Sapos', cmd:'Clement, the Worrywort', cores:'GU'},
  {nome:'Vampiros', cmd:'Edgar Markov', cores:'RWB'},
  {nome:'Ephara (incompleto)', cmd:'Ephara, God of the Polis', cores:'WU', cartas:98}
];
const TONS = {W:['#cbbb92','#6a5c40','#fff6d0'], U:['#3a6a9a','#132c48','#6fb8ff'], B:['#4a3c44','#141016','#b08ad0'], R:['#9a3c26','#3e140c','#ff7a4a'], G:['#357a42','#12341c','#7ad07a'], C:['#6a665e','#2a2722','#d8d8d8']};
function cores(c){
  const cs = [...c].filter(k=>TONS[k]);
  if (cs.length >= 4) return {c1:'#9a7a32', c2:'#3e2c10', brilho:'#ffd04a88'};
  if (cs.length === 0) return {c1:TONS.C[0], c2:TONS.C[1], brilho:TONS.C[2]+'88'};
  return {c1:TONS[cs[0]][0], c2:TONS[cs[cs.length-1]][1], brilho:TONS[cs[0]][2]+'88'};
}
document.getElementById('grade').innerHTML = DECKS.map(d=>{
  const k = cores(d.cores), n = d.cartas || 100;
  return `<div><div class="cena" style="--c1:${k.c1};--c2:${k.c2};--brilho:${k.brilho}">
    <div class="caixa">
      <div class="sombra"></div>
      <div class="face fundo couro"></div>
      <div class="face dentro"></div>
      <div class="face tras couro"></div>
      <div class="monte"></div>
      <div class="cmd" style="background-image:url('${img(d.cmd)}')"></div>
      <div class="face esq couro"><div class="lombada">${d.cmd}</div></div>
      <div class="face dir couro"><div class="lombada">${d.nome}</div></div>
      <div class="face frente couro"><i></i><i></i><i></i><i></i>
        <div class="gemas">${[...d.cores].map(x=>`<img src="https://svgs.scryfall.io/card-symbols/${x}.svg" alt="${x}">`).join('')}</div>
        <div class="placa"><b>${d.nome}</b></div>
        <div class="qtd ${n !== 100 ? 'aviso' : ''}">${n} CARTAS</div>
      </div>
    </div>
  </div><div class="rotulo">${d.cmd}</div></div>`;
}).join('');
</script>
</body></html>
