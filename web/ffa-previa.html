<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia: todos contra todos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
:root{--ff:'Cinzel',serif;--ouro:#E4C874;--jog:#e0a040;--bot:#a07ad0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#120c08 url('https://api.scryfall.com/cards/named?exact=Atraxa%2C%20Praetors%27%20Voice&format=image&version=art_crop') center/cover fixed;font-family:'EB Garamond',serif;color:#eee;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:#0a0604d4}
#ctrl{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;gap:8px;flex-wrap:wrap}
#ctrl button{font-family:var(--ff);background:#3a2a18;border:1px solid var(--ouro);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}
#ctrl button:hover{filter:brightness(1.2)}

/* ---------- sala de espera ---------- */
#sala{position:relative;z-index:1;max-width:1100px;margin:70px auto 0;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s}
#sala h2{font-family:var(--ff);color:var(--ouro);margin:0;letter-spacing:.08em}
.sub{font-size:14px;color:#bfa88f;margin-bottom:26px}
.fila{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.lugar{position:relative;width:230px;height:300px;border-radius:12px;background:#1a120c center 25%/cover;border:2px solid;box-shadow:0 8px 24px #000a;animation:boia 4s ease-in-out infinite}
.lugar:nth-child(2){animation-delay:-1s}.lugar:nth-child(3){animation-delay:-2s}.lugar:nth-child(4){animation-delay:-3s}
@keyframes boia{50%{transform:translateY(-5px)}}
.lugar.jog{border-color:#e0a04099;box-shadow:0 0 18px #e0a04033,0 8px 24px #000a}
.lugar.bot{border-color:#a07ad099;box-shadow:0 0 18px #a07ad033,0 8px 24px #000a}
.lugar.eu{border-color:var(--ouro);box-shadow:0 0 0 1px var(--ouro),0 0 26px #e4c87455,0 8px 24px #000a}
.lugar::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(0deg,#000d 0%,#0006 38%,transparent 65%)}
.lugar .num{position:absolute;top:8px;left:10px;z-index:1;font-family:var(--ff);font-size:11px;letter-spacing:.2em;color:#fff;text-shadow:0 1px 4px #000;opacity:.8}
.lugar .cmd{position:absolute;left:10px;right:10px;bottom:40px;z-index:1;font-family:var(--ff);font-size:15px;color:#fff;text-shadow:0 2px 6px #000;text-align:center;line-height:1.15}
.lugar .av{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);z-index:2;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff);font-weight:800;font-size:19px;color:#fff;border:3px solid}
.lugar.jog .av,.lugar.eu .av{background:#5a3a14;border-color:var(--jog)}
.lugar.bot .av{background:#3a2a4a;border-color:var(--bot)}
.lugar .quem{position:absolute;left:0;right:0;bottom:-50px;text-align:center;font-size:14px;color:#e8d8c0}
.lugar .quem small{display:block;font-size:11.5px;color:#a8957d}
.lugar.vazio{background:repeating-linear-gradient(45deg,#1a120c,#1a120c 10px,#20160e 10px,#20160e 20px);border-style:dashed;border-color:#e0a04055;display:grid;place-items:center;color:#bfa88f;font-size:14px;text-align:center;animation:none}
.lugar.vazio::after{display:none}
.lugar.vazio span{animation:pisca 1.6s ease-in-out infinite}
@keyframes pisca{50%{opacity:.4}}
.lugar.entrou{animation:entrou .6s ease-out, boia 4s ease-in-out .6s infinite}
@keyframes entrou{from{transform:scale(.9);filter:brightness(2)}to{transform:none}}
.btnComecar{margin-top:66px;font-family:var(--ff);font-size:16px;padding:10px 40px;border-radius:9px;border:1px solid var(--ouro);background:linear-gradient(#e0b050,#a87a28);color:#1a1008;cursor:pointer}
.btnComecar:disabled{opacity:.45;cursor:default}

/* ---------- entrada: as cartas sobem em leque e flutuam ---------- */
#ent{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;perspective:1400px}
#ent.on{display:block}
#ent .fundo{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a0e06f2,#050302fa 70%);opacity:0;animation:aparece .5s forwards}
#ent.sai .fundo{animation:some .7s .5s forwards}
@keyframes aparece{to{opacity:1}}@keyframes some{from{opacity:1}to{opacity:0}}
#ent .leque{position:absolute;left:50%;top:50%;width:0;height:0}
#ent .c{position:absolute;width:min(14vw,180px);aspect-ratio:63/88;left:calc(min(14vw,180px) / -2);top:calc(min(14vw,180px) * -.7);opacity:0;
  transform:translateY(80vh) rotate(0);animation:sobe 1.1s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:var(--d)}
@keyframes sobe{to{opacity:1;transform:translateX(var(--x)) translateY(var(--y)) rotate(var(--r))}}
#ent .f{position:absolute;inset:0;border-radius:4.5%/3.3%;background:#000 center/cover;animation:flutua 3.2s ease-in-out infinite;animation-delay:var(--fd)}
@keyframes flutua{0%,100%{transform:translateY(0) rotateZ(-.6deg)}50%{transform:translateY(-14px) rotateZ(.6deg)}}
#ent .c.jog .f{box-shadow:0 0 0 2px #ffe8b088,0 0 30px 6px #e0a040aa,0 20px 40px #000c}
#ent .c.bot .f{box-shadow:0 0 0 2px #d8c0ff88,0 0 30px 6px #a07ad0aa,0 20px 40px #000c}
#ent .av{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff);font-weight:800;color:#fff;border:3px solid}
#ent .jog .av{background:#5a3a14;border-color:var(--jog)}#ent .bot .av{background:#3a2a4a;border-color:var(--bot)}
#ent .nm{position:absolute;left:-30%;right:-30%;bottom:-44px;text-align:center;font-family:var(--ff);font-size:13px;color:#fff;text-shadow:0 2px 8px #000}
#ent .titulo{position:absolute;left:0;right:0;top:9vh;text-align:center;font-family:var(--ff);font-weight:800;font-size:clamp(26px,3.4vw,46px);letter-spacing:.12em;color:#ffe08a;text-shadow:0 0 18px #ff9a3a,0 0 40px #ff6a2a77;opacity:0;transform:scale(2.4);animation:bate .4s 1.5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bate{to{opacity:1;transform:scale(1)}}
#ent.treme .leque{animation:treme .35s}
@keyframes treme{20%{margin-left:6px;margin-top:-4px}40%{margin-left:-5px;margin-top:3px}60%{margin-left:4px;margin-top:4px}80%{margin-left:-3px;margin-top:-2px}}
#ent .txt{position:absolute;left:0;right:0;bottom:5vh;text-align:center;color:#bfa88f;font-size:14px;opacity:0;animation:aparece .5s 2s forwards}
#ent.sai .c{animation:saiC .8s cubic-bezier(.6,0,.4,1) forwards}
@keyframes saiC{from{opacity:1;transform:translateX(var(--x)) translateY(var(--y)) rotate(var(--r))}to{opacity:0;transform:translateX(var(--x)) translateY(80vh) rotate(var(--r))}}
#ent.sai .titulo,#ent.sai .txt{transition:opacity .3s;opacity:0}
.faisca{position:fixed;left:50%;top:22vh;width:6px;height:6px;border-radius:50%;background:#ffe08a;box-shadow:0 0 10px #ff9a3a;z-index:21;pointer-events:none;animation:faisca .9s ease-out forwards}
@keyframes faisca{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--x),var(--y))}}
</style></head><body>
<div id="ctrl"><button id="bEntra">Simular: amigo entrou</button><button id="bPronto">Simular: partida carregou</button><button id="bReset">Recomeçar prévia</button></div>

<div id="sala">
  <h2>Sexta do Commander</h2>
  <div class="sub">Todos contra todos · 4 lugares · bots no normal</div>
  <div class="fila" id="fila"></div>
  <button class="btnComecar" id="bComecar" disabled>Começar partida</button>
</div>
<div id="ent"></div>

<script>
const q = n => encodeURIComponent(n).replace(/'/g,'%27');
const art = n => `https://api.scryfall.com/cards/named?exact=${q(n)}&format=image&version=art_crop`;
const img = n => `https://api.scryfall.com/cards/named?exact=${q(n)}&format=image&version=normal`;
const LUG = [
  {cmd:'Baba Lysaga, Night Witch', nome:'Twelvez', deck:'Baby Lasagna', av:'T', tipo:'eu'},
  {cmd:'Krenko, Mob Boss', nome:'Irmão', deck:'Goblins', av:'I', tipo:'jog'},
  {cmd:'Edgar Markov', nome:'Kaldrax', deck:'Vampiros', av:'K', tipo:'jog', espera:true},
  {cmd:'Selvala, Heart of the Wilds', nome:'Bot 1', deck:'Debandada de Selvala', av:'B1', tipo:'bot'}
];
let entrou = false;
function desenharSala(){
  document.getElementById('fila').innerHTML = LUG.map((p,i)=> (p.espera && !entrou)
    ? `<div class="lugar vazio"><span>Lugar ${i+1}<br>Esperando jogador...</span></div>`
    : `<div class="lugar ${p.tipo} ${p.espera?'entrou':''}" style="background-image:url('${art(p.cmd)}')"><div class="num">LUGAR ${i+1}</div><div class="cmd">${p.cmd}</div><div class="av">${p.av}</div><div class="quem">${p.tipo==='eu'?p.nome+' (você)':p.nome}<small>${p.deck}</small></div></div>`).join('');
  document.getElementById('bComecar').disabled = !entrou;
}
let inicio = 0, saiu = false;
function comecar(){
  const ent = document.getElementById('ent'), n = LUG.length;
  const passo = Math.min(19, 100 / n);   // vw entre as cartas
  ent.className = ''; void ent.offsetWidth;
  ent.innerHTML = `<div class="fundo"></div><div class="titulo">Que comece a partida</div><div class="leque">${LUG.map((p,i)=>{
      const k = i - (n-1)/2;
      return `<div class="c ${p.tipo==='bot'?'bot':'jog'}" style="--x:${k*passo}vw;--y:${Math.abs(k)*3}vh;--r:${k*4}deg;--d:${i*.14}s;--fd:${1.2+i*.3}s"><div class="f" style="background-image:url('${img(p.cmd)}')"><div class="av">${p.av}</div><div class="nm">${p.nome}</div></div></div>`;
    }).join('')}</div><div class="txt">Embaralhando...</div>`;
  ent.classList.add('on'); document.getElementById('sala').style.opacity = .15;
  inicio = Date.now(); saiu = false;
  setTimeout(()=>{ const a = new Audio('sons/espadas/choque1.ogg'); a.volume = .12; a.play().catch(()=>{}); ent.classList.add('treme');
    for (let i=0;i<24;i++){ const f = document.createElement('div'); f.className = 'faisca'; const g = Math.random()*Math.PI*2, r = 80+Math.random()*240;
      f.style.setProperty('--x', Math.cos(g)*r+'px'); f.style.setProperty('--y', Math.sin(g)*r*.5+'px'); document.body.appendChild(f); setTimeout(()=>f.remove(), 1000); } }, 1550);
}
function sair(){
  const ent = document.getElementById('ent'); if (!ent.classList.contains('on') || saiu) return; saiu = true;
  setTimeout(()=>{ ent.classList.add('sai'); setTimeout(()=>{ ent.className=''; ent.innerHTML=''; document.getElementById('sala').style.opacity = 0; }, 1300); }, Math.max(0, 5000 - (Date.now()-inicio)));
}
document.getElementById('bEntra').onclick = ()=>{ entrou = true; desenharSala(); };
document.getElementById('bComecar').onclick = comecar;
document.getElementById('bPronto').onclick = sair;
document.getElementById('bReset').onclick = ()=>{ entrou = false; document.getElementById('sala').style.opacity = 1; const e = document.getElementById('ent'); e.className=''; e.innerHTML=''; desenharSala(); };
desenharSala();
</script>
</body></html>
